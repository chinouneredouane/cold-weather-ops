<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><style>.academy-link{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--green-ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}.academy-link:hover{background:var(--green-soft)}@media (max-width:640px){.academy-link{font-size:12px;padding:3px 7px}}</style></head><body><title>Command Upgrade Training Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cockpit-style course map on the left, one briefing at a time on the right, knowledge check closes each briefing. */
:root {
  --green: #1E7B34; --green-ink: #14592A; --green-soft: #E7F2E9; --red: #C0272D; --red-soft: #FBE9EA;
  --bg: #F6F8F6; --surface: #FFFFFF; --fg: #1C2420; --muted: #5E6B63; --line: #D7DFD9;
  --on-accent: #FFFFFF; --fig-bg: #FFFFFF;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --green: #4FB86A; --green-ink: #7FD394; --green-soft: #17291D; --red: #EF5A5F; --red-soft: #33191B;
  --bg: #0F1512; --surface: #161E19; --fg: #E4ECE6; --muted: #9AA9A0; --line: #2A372F; --on-accent: #0F1512; --fig-bg: #F4F6F4; color-scheme: dark } }
:root[data-theme="dark"] {
  --green: #4FB86A; --green-ink: #7FD394; --green-soft: #17291D; --red: #EF5A5F; --red-soft: #33191B;
  --bg: #0F1512; --surface: #161E19; --fg: #E4ECE6; --muted: #9AA9A0; --line: #2A372F; --on-accent: #0F1512; --fig-bg: #F4F6F4; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 3px solid var(--green);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.topbar-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 30px; width: auto; background: #fff; border-radius: 3px; padding: 2px 4px; }
.brand-title { font: 700 15px/1.1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--green-ink); }
.overall { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 180px; flex: 0 1 280px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--green); width: 0; transition: width .4s; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 6px 12px; }

/* Shell */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100% - 60px); }
nav.map { border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px 40px max(14px, env(safe-area-inset-left, 0px));
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
.map h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin: 18px 8px 6px; }
.map a { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 15px; line-height: 1.25; }
.map a:hover { background: var(--green-soft); }
.map a.current { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); font-weight: 600; }
.map a.locked { color: var(--muted); }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--font-data); border: 2px solid var(--line); color: var(--muted); }
.dot.done { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.dot.open { border-color: var(--green); color: var(--green); }

main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.page { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }
.page > *, .hero > *, .quiz-body > *, section.sec > * { min-width: 0; }

/* Banner */
.banner { display: grid; grid-template-columns: 110px 1fr; border-radius: 10px; overflow: hidden; background: var(--green-soft); }
.banner .phase { background: var(--green); color: var(--on-accent); display: grid; place-content: center; text-align: center; padding: 14px 6px; }
.banner .phase small { font: 600 12px var(--font-body); letter-spacing: .12em; }
.banner .phase b { font: 700 46px/1 var(--font-display); }
.banner .txt { padding: 18px 22px; display: grid; gap: 6px; }
.eyebrow { font: 600 13px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.banner h1 { font-size: clamp(28px, 4vw, 38px); color: var(--green-ink); }
.facts { display: grid; grid-template-columns: 170px 1fr; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 15px; }
.facts > div { padding: 10px 14px; border-top: 1px solid var(--line); }
.facts > div:nth-child(-n+2) { border-top: 0; }
.facts .k { font-weight: 600; color: var(--green-ink); background: var(--green-soft); }
.facts ul { margin: 0; padding-left: 18px; }

section.sec { display: grid; gap: 14px; }
section.sec h2 { font-size: 26px; color: var(--green-ink); padding-bottom: 6px; border-bottom: 2px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
section.sec h2 .n { font: 600 15px var(--font-data); color: var(--red); }
p { margin: 0; max-width: 68ch; }
ul.b, ol.o { margin: 0; padding-left: 22px; display: grid; gap: 6px; max-width: 68ch; }
ul.b li::marker { color: var(--red); }
ol.o li::marker { color: var(--green); font-weight: 700; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { background: var(--green); color: var(--on-accent); text-align: left; padding: 9px 12px; font-weight: 600; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--green-soft) 45%, transparent); }
td.first { font-weight: 600; }
figure { margin: 0; display: grid; gap: 8px; }
figure .img { background: var(--fig-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
figure img { display: block; width: 100%; min-width: 520px; height: auto; }
figcaption { font-size: 14px; color: var(--muted); text-align: center; }
.flow { display: grid; gap: 0; }
.flow .t { background: var(--red); color: #fff; font: 600 15px var(--font-body); padding: 9px 14px; border-radius: 8px 8px 0 0; text-align: center; }
.step { display: grid; grid-template-columns: 46px 1fr; background: var(--green-soft); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.step .num { background: var(--green); color: var(--on-accent); display: grid; place-items: center; font: 700 18px var(--font-display); }
.step .body { padding: 10px 14px; font-size: 15.5px; }
.arrow { height: 16px; display: grid; place-items: center; color: var(--red); font-size: 12px; background: var(--surface); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.flow .step:last-child { border-bottom: 1px solid var(--line); border-radius: 0 0 8px 8px; overflow: hidden; }
.decision { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.decision .q { background: var(--green); color: var(--on-accent); padding: 10px 14px; font-weight: 600; text-align: center; }
.decision .cols { display: grid; grid-template-columns: 1fr 1fr; }
.decision .col { padding: 12px 16px; display: grid; gap: 6px; align-content: start; }
.decision .yes { background: var(--green-soft); } .decision .no { background: var(--red-soft); }
.decision .col b { font-family: var(--font-display); font-size: 17px; letter-spacing: .03em; }
.decision .yes b { color: var(--green-ink); } .decision .no b { color: var(--red); }
.decision ul { margin: 0; padding-left: 18px; font-size: 15px; display: grid; gap: 4px; }
.callout { border-left: 6px solid var(--green); background: var(--green-soft); padding: 14px 18px; border-radius: 0 8px 8px 0; display: grid; gap: 8px; }
.callout.red { border-left-color: var(--red); background: var(--red-soft); }
.callout .h { font: 700 14px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--green-ink); }
.callout.red .h { color: var(--red); }
.callout ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* Quiz */
.quiz { border: 2px solid var(--green); border-radius: 12px; background: var(--surface); overflow: hidden; }
.quiz-head { background: var(--green); color: var(--on-accent); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.quiz-head h2 { font-size: 24px; }
.qdots { display: flex; gap: 5px; flex-wrap: wrap; }
.qdots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }
.qdots span.ok { background: #fff; border-color: #fff; }
.qdots span.ko { background: var(--red); border-color: #fff; }
.qdots span.cur { box-shadow: 0 0 0 3px rgba(255,255,255,.45); }
.quiz-body { padding: 20px; display: grid; gap: 14px; }
.qnum { font: 600 14px var(--font-data); color: var(--red); }
.qtext { font: 600 21px/1.3 var(--font-display); }
textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; background: var(--bg); color: var(--fg); resize: vertical; }
.model { background: var(--green-soft); border-radius: 8px; padding: 12px 16px; display: grid; gap: 4px; }
.model .h { font: 700 13px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--green-ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 11px 18px; font-weight: 600; background: var(--green); color: var(--on-accent); }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--green-ink); border: 2px solid var(--green); }
.btn.red { background: var(--red); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.result { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.score { font: 700 64px/1 var(--font-display); color: var(--green); }
.score.fail { color: var(--red); }
.hint { font-size: 14px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }

/* Home and certificate */
.hero { display: grid; gap: 16px; padding: 28px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-top: 8px solid var(--green); box-shadow: inset 0 -8px 0 var(--red); }
.hero img { height: 54px; width: auto; justify-self: start; background: #fff; border-radius: 4px; padding: 3px 6px; }
.hero h1 { font-size: clamp(32px, 5vw, 48px); color: var(--green-ink); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.stats b { display: block; font: 700 28px var(--font-display); color: var(--fg); }
label.f { display: grid; gap: 6px; font-weight: 600; max-width: 420px; }
input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; background: var(--bg); color: var(--fg); }
.cert { border: 3px double var(--green); border-radius: 12px; padding: 34px 26px; background: var(--surface); text-align: center; display: grid; gap: 14px; justify-items: center; }
.cert .who { font: 700 clamp(28px, 5vw, 40px) var(--font-display); color: var(--green-ink); }
.notice { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); padding: 10px 14px; border-radius: 8px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font: 600 13px var(--font-body); }
.pill.ok { background: var(--green-soft); color: var(--green-ink); } .pill.ko { background: var(--red-soft); color: var(--red); } .pill.na { background: var(--line); color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.map { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); height: 100%; z-index: 20; transform: translateX(-102%); transition: transform .25s; box-shadow: 4px 0 24px rgba(0,0,0,.2);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  nav.map.open { transform: none; }
  .menu-btn { display: inline-block; }
  .overall { flex-basis: 100%; margin-left: 0; }
}
@media (max-width: 560px) {
  .banner { grid-template-columns: 1fr; } .banner .phase { grid-auto-flow: column; gap: 10px; align-items: center; padding: 8px; } .banner .phase b { font-size: 28px; }
  .facts { grid-template-columns: 1fr; } .facts > div:nth-child(2) { border-top: 1px solid var(--line); }
  .decision .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="topbar-inner">

<script>
const COURSE = {"intro":[{"h":"How to use this document","blocks":[{"p":"This document is the training support for the 20 practical briefings (PL 01 to PL 20) of the Domestic Airlines command upgrade course. Each briefing is prepared by the candidate during line training and presented to the line training captain (TRI), who completes and signs it (OM D §2.2.4.4.1 and §2.3.6)."},{"p":"Every briefing follows the same structure, so the candidate always knows where to find the information:"},{"table":{"head":["Part","What it contains"],"widths":[0.3,0.7],"rows":[["Banner and summary","Briefing number, phase, aim, learning outcomes, company references, method and time."],["Numbered sections","The subject explained in detail, with tables, figures and process diagrams in company colours."],["Captain’s key points","The few ideas the candidate must be able to state without notes."],["Knowledge check","Ten questions to verify the candidate’s capability, with space for the answer. Target 8/10."],["Notes column","The left column of every page is kept free for the candidate’s and the instructor’s notes."]]}},{"box":{"title":"Status of this document","tone":"red","items":["This is a training document. It explains and illustrates; it does not replace OM A, OM B, OM C, OM D, the SOP, the MEL, the QRH or the AFM.","Fleet-specific values (limits, speeds, procedures) always come from the manuals in force for the aircraft being flown.","Report any difference between this document and a manual to the Training Department."]}}]},{"h":"Regulatory foundation","blocks":[{"p":"The command upgrade course prepares senior first officers to become Pilot-in-Command (PIC). Its aim is to move the candidate from tactical execution to strategic command, with total accountability for the safety of the aircraft, passengers and crew. The course is aligned with the following texts:"},{"table":{"head":["Text","What it governs"],"widths":[0.38,0.62],"rows":[["ICAO Annex 6, Part I, Chapter 9","Standards for PIC training, recent experience and route/aerodrome qualification."],["EASA Part-ORO, ORO.FC.205 and AMC1","Command course content: command responsibilities, CRM, LOFT simulator sessions and line training under supervision."],["Law n° 98-06 and 19-04","General rules for civil aviation and the legal authority of the PIC."],["Executive Decree n° 06-08","Professional qualifications of flight crew."],["Executive Order n° 10-140","Flight crew working hours, flight time limitations and commander’s discretion."],["Executive Decree n° 20-343","National Civil Aviation Security Programme."],["Company manuals","OM A (general), OM B (aircraft), OM C (routes and aerodromes), OM D (training), SOP, MEL, QRH."]]}}]},{"h":"Course structure and the place of the briefings","blocks":[{"p":"The briefings are delivered during the line training phase. They deepen the knowledge acquired in ground school and the simulator, and link it to real operations on the company network."},{"flow":{"title":"Command upgrade course (OM D §2.2)","steps":["**Selection:** selection file, preliminary screening, ground and flight evaluation (at least 6 sectors with 3 different TRIs), final screening.","**Phase 1 — Ground school:** company policy and the captain’s role, systems, procedures, mass and balance, MEL/CDL, performance, safety and rescue, CRM/TEM.","**Phase 2 — Simulator and aircraft:** left-seat familiarisation, fixed-base and full flight simulator sessions, simulator check, off-line flight and check.","**Phase 3 — Line training:** supervised sectors in three phases (45 h / 24 sectors for a first command). **The 20 practical briefings are presented here.**","**Line release check (CEL):** two sectors with a TRE; decides the release as captain.","**CRM/TEM verification:** two sectors with a first officer, observed by a TRI/TRE."]}},{"table":{"head":["Phase","Briefings"],"widths":[0.55,0.45],"rows":[["1. Operational framework, documentation and regulations","PL 01, PL 08"],["2. Flight preparation, weather and performance","PL 02, PL 03, PL 04, PL 06, PL 07, PL 09"],["3. In-flight management and navigation","PL 05, PL 10, PL 11"],["4. Systems failures and abnormal operations","PL 12, PL 15, PL 16, PL 17"],["5. Severe emergencies, security and rescue","PL 13, PL 14, PL 18, PL 19, PL 20"]]}}]},{"h":"The captain’s decision model","blocks":[{"p":"All 20 briefings use the same decision model. The candidate is expected to apply it aloud, in the simulator and on the line, and to explain it during the interview and the line release check."},{"flow":{"title":"Command decision model","steps":["**Fly the aircraft.** Control the flight path; use the automation; decide who is PF.","**Get safe.** Safe altitude, terrain clearance, a hold or vectors in a safe area; declare PAN PAN or MAYDAY when needed.","**Gather the facts.** Aircraft state, fuel, weather, time available, passengers.","**List the options,** including the safest one (hold, return, divert, continue).","**Check the rules:** limitations, QRH, MEL, SOP, OM A.","**Decide and brief.** Tell the crew what you will do and why; invite challenge.","**Act and review.** Monitor the result and be ready to change the plan.","**Inform.** ATC, cabin crew (PNC), passengers (PAX) and the company (CCO)."]}},{"box":{"title":"Command principle","tone":"green","items":["Delegating a task never delegates responsibility.","When in doubt, choose the option that keeps the most margins: time, fuel, altitude and runway.","Schedule pressure is real, but the captain has the authority and the duty to delay or cancel when safety requires it (OM A §1.4.2)."]}}]}],"briefings":[{"code":"PL 01","title":"Course Organisation, Documentation and Generalities","phase":"Phase 1 — Operational framework, documentation and regulations","aim":"Explain how the command upgrade course is organised, which documents the captain must master, and the legal authority and responsibility of the Pilot-in-Command.","outcomes":["Describe the course phases and how progress is assessed","Use the documentation hierarchy to find any rule quickly","State the captain’s legal authority and responsibilities","Organise task sharing and ground handling oversight"],"refs":"OM D §2.2, §2.3.6; OM A §1.4, §1.5, Section 2; OM C section 0; SOP §1.11–1.14; Jeppesen and AIP","sections":[{"h":"Course organisation","blocks":[{"p":"The purpose of the course is to transform an experienced first officer into a captain who holds the leadership, knowledge and decision-making capacity to carry the ultimate legal responsibility for the flight. Handling skill is assumed; the course develops **command judgement**."},{"p":"The Training Department sets the course schedule. A responsible instructor mentors the candidate, ensures that SOPs are applied, and assesses the candidate’s command mindset throughout the course."},{"table":{"head":["Training element","Content","What is assessed"],"widths":[0.24,0.43,0.33],"rows":[["Theoretical instruction","Command responsibilities, legal framework, advanced systems management.","Written test and interview."],["Simulator instruction","Scenario-based LOFT sessions with complex abnormal and emergency situations.","Decision making, CRM/TEM, task sharing."],["Flight handling","Aircraft handling and manoeuvrability from the left seat.","Precision and flight path control."],["Line training","Supervised sectors with a line training captain; presentation of PL 01–PL 20.","Operational command in the real environment."],["Final command check","Line release check (CEL) by a TRE.","Fitness for release as captain."]]}},{"p":"Progress is monitored continuously and recorded in the progress booklet (flights, briefings prepared, exercises and approaches). A weak area found early is corrected early; it is not hidden until the final check."}]},{"h":"Documentation framework","blocks":[{"p":"A captain does not need to remember every figure, but must know **where each rule is written** and find it fast, under pressure. The documentation is organised in four families:"},{"table":{"head":["Family","Documents","Typical use by the captain"],"widths":[0.2,0.45,0.35],"rows":[["Company","OM Parts A, B, C, D; Safety and Rescue Manual; flight crew statutes; company minima.","Policy, duties, fuel, minima, training, emergency equipment."],["Official","Civil Aviation Code; air transport and air traffic regulations; AIP; holding and instrument approach procedures.","Legal basis, rules of the air, aerodrome information."],["Aircraft","AFM; MEL/DDPG; take-off and go-around limitation data.","Limitations, dispatch with inoperative items, performance."],["Crew","Jeppesen route and terminal charts; normal and non-normal checklists; QRH.","Daily flight preparation and conduct of the flight."]]}},{"warn":"Before every study session and every flight, check that the documents are current (revision status and NOTAM/AIP amendments). An out-of-date page is a hidden threat."}]},{"h":"The captain’s legal authority","blocks":[{"p":"Under OM A §1.4 the captain is the final authority on the operation of the aircraft. Authority and responsibility start when the captain takes command and end when the aircraft is secured at destination, and include the safety of passengers, crew and cargo from door closure (OM A §1.4.2)."},{"ul":["Decides whether the aircraft is fit for the flight and signs the release documents (OFP, fuel, technical log).","May delay, divert or discontinue a flight for safety, and decides the fuel to be loaded above the minimum.","Must refuse an ATC clearance that would compromise safety (SOP §1.11).","In an emergency may take any necessary action, even against a local rule, then informs the authorities and gives the reasons (OM A §1.5.5.3).","Reports safety events and protects FDR/CVR data after an incident or accident."]}]},{"h":"General operational command","blocks":[{"p":"Command is exercised through organisation. The captain distributes tasks between PF and PM, keeps an open but clear cockpit gradient, and supervises every partner who touches the aircraft."},{"flow":{"title":"Captain’s day: from report to secured aircraft","steps":["**Report and crew briefing:** fitness, roles, weather, MEL items, security password, cabin communication.","**Flight preparation:** review of the flight folder (OFP, weather, NOTAM, mass and balance, fuel).","**Aircraft acceptance:** technical log, HIL items, MEL decisions, walk-around.","**Ground handling oversight:** fuelling, loading, catering, passenger boarding, doors.","**Conduct of the flight:** task sharing, threat and error management, decisions.","**After the flight:** reports, technical log entries, handover to the next crew."]}}]}],"key":["Know where each rule is written: OM A for policy, OM B for the aircraft, OM C for aerodromes, OM D for training.","Authority is legal and personal; responsibility cannot be delegated.","Command is exercised through clear task sharing and active supervision of ground handling.","Progress is continuous: every flight of line training counts."],"questions":["What is the main purpose of the command upgrade course?","Name the five training elements of the course and what each one assesses.","Where is the progress of the candidate recorded during line training?","List the four families of documentation and give one example of each.","Which manual contains the company fuel policy, and which contains aerodrome categories?","When does the captain’s responsibility for passengers and crew begin and end?","What may the captain do in an emergency that requires breaking a local rule, and what must follow?","What does the captain’s signature on the OFP and technical log mean?","Give three ground handling activities the captain must supervise.","Why is a clear cockpit gradient important when you are the new captain?"],"answers":["To develop command judgement and leadership so the candidate can carry the PIC’s legal responsibility safely.","Theory (written/interview), simulator (decision making and CRM), flight handling (precision), line training (operational command), final check (fitness for release).","In the progress booklet (livret de progression), OM D §2.2.5.","Company (OM A–D), official (AIP, Civil Aviation Code), aircraft (AFM, MEL), crew (Jeppesen charts, checklists, QRH).","Fuel policy: OM A §8.1.5. Aerodrome categories: OM C §11.","From taking command (passengers, crew and cargo from door closure, OM A §1.4.2) until the aircraft is secured at destination.","Take any action necessary for safety, then inform the local authorities without delay and give the reasons (OM A §1.5.5.3).","That the captain agrees the flight can be done safely, within company policy and ANAC regulations.","Fuelling, loading and mass and balance, passenger boarding, doors and ground equipment.","The first officer must feel free to challenge, while the captain keeps the final decision; too steep or too flat a gradient both degrade safety."]},{"code":"PL 08","title":"Air Traffic Regulations","phase":"Phase 1 — Operational framework, documentation and regulations","aim":"Master the rules of the air, the use of air traffic services, radio failure and interception procedures, and the captain’s reporting duties after incidents.","outcomes":["Apply IFR/VFR rules and distinguish IMC from VMC","Manage flight plans, including repetitive plans (RPL)","Apply radio failure and interception procedures","Report air proximity events, incidents and accidents correctly"],"refs":"OM A Section 11, Section 12; OM C §6.1 (communication failure); SOP §1.15, §1.34–1.36; ICAO Annex 2 and 11; Jeppesen","sections":[{"h":"Flight rules and meteorological conditions","blocks":[{"p":"The flight rules (IFR or VFR) describe how the flight is conducted; the meteorological conditions (IMC or VMC) describe the weather in which it is flown. A company IFR flight may be flown in VMC, but a VFR flight may never continue into IMC."},{"table":{"head":["Item","IFR","VFR"],"widths":[0.26,0.37,0.37],"rows":[["Navigation","By instruments, on published routes and procedures.","By visual reference to the ground."],["Separation","Provided by ATC in controlled airspace.","Pilot’s responsibility (\"see and avoid\"), depending on the class."],["Minimum altitude","Published minimum altitudes (OM C section 1).","Visual minimum heights over terrain and built-up areas."],["Company use","Standard for all commercial flights.","Exceptional (e.g. ferry or positioning), when approved."]]}}]},{"h":"Flight plans","blocks":[{"p":"Every company flight is covered by an ATC flight plan, filed as an individual plan or as a repetitive flight plan (RPL) for scheduled flights. The captain checks that the filed plan matches the OFP (route, level, speed, alternates, equipment codes) and that any change of aircraft or equipment status is notified."},{"ul":["Delay: update the plan when the delay exceeds the tolerance in the AIP.","Change of aircraft or degraded equipment (e.g. RNAV or RVSM capability lost): amend the equipment codes.","Closing: IFR plans close automatically on landing at a controlled aerodrome; otherwise the crew closes them."]}]},{"h":"Air traffic services and radar","blocks":[{"table":{"head":["Service","Purpose","Captain’s use"],"widths":[0.22,0.4,0.38],"rows":[["Air traffic control","Prevent collisions and expedite traffic.","Clearances and instructions; accept only those that are safe."],["Flight information","Information useful for safe and efficient flight.","Weather, aerodrome status, traffic information."],["Alerting","Notify rescue services when an aircraft needs help.","Triggered by MAYDAY/PAN or by loss of contact."],["Radar service","Identification, vectoring, traffic and terrain information.","Confirm identification; remain aware of terrain when vectored."]]}},{"warn":"A radar vector does not transfer terrain responsibility in every case. Know the minimum safe altitude at all times and question any clearance below it."}]},{"h":"Radio communication failure","blocks":[{"p":"Communication failure procedures are published in OM C §6.1 and in the AIP of each State. The crew first tries every means: other frequencies, second VHF, relay by another aircraft, company frequency, and the mobile telephone when authorised."},{"decision":{"question":"Radio communication failure confirmed: are you in VMC?","yesLabel":"YES — VMC","noLabel":"NO — IMC","title":"Radio failure decision","yes":["Squawk 7600","Continue in VMC","Land at the nearest suitable aerodrome","Report arrival to ATC by any means"],"no":["Squawk 7600","Follow the published procedure (OM C §6.1 / AIP)","Keep the last assigned level and speed for the time required, then the flight-planned profile","Proceed to the approach fix, hold, and start the approach at or close to the expected time"]}}]},{"h":"Visual signals and interception","blocks":[{"p":"Light signals from the tower and interception signals are in ICAO Annex 2 and the Jeppesen emergency pages. If intercepted, the captain follows the interceptor’s instructions, tries to contact it on 121.5 MHz, squawks 7700 unless told otherwise by ATC, and informs ATC."},{"table":{"head":["Tower light signal","Aircraft in flight","Aircraft on the ground"],"widths":[0.3,0.35,0.35],"rows":[["Steady green","Cleared to land","Cleared for take-off"],["Steady red","Give way and continue circling","Stop"],["Flashing green","Return for landing","Cleared to taxi"],["Flashing red","Aerodrome unsafe, do not land","Taxi clear of the landing area"],["Flashing white","—","Return to starting point"]]}}]},{"h":"Reporting: air proximity, incidents and accidents","blocks":[{"p":"The captain reports every air proximity event (Airprox/Airmiss) by radio at once and confirms it in writing. Incidents and irregularities are reported through the company reporting system (OM A Section 11 and Section 14). After an accident or serious incident, the captain reports to the authorities and to the operator within the legal delay, protects the flight recorders, and records the facts."}]}],"key":["IFR/VFR is a rule; IMC/VMC is the weather.","Check the filed flight plan against the OFP and update it after any change.","Know the radio failure procedure for the State you fly in before you need it.","Report Airprox by radio immediately, then in writing."],"questions":["Explain the difference between IFR/VFR and IMC/VMC.","What must you check when comparing the ATC flight plan with the OFP?","What is an RPL, and when must the flight plan be amended?","Name the three air traffic services and their purpose.","Who is responsible for terrain clearance when you are radar vectored?","What is your squawk code and first action after a confirmed radio failure in IMC?","Where do you find the communication failure procedure for an Algerian aerodrome?","What does a flashing red light signal mean to an aircraft in flight?","List the actions of the captain if intercepted.","What reports must the captain make after an Airprox and after an accident?"],"answers":["IFR/VFR are flight rules (how the flight is conducted); IMC/VMC are weather conditions.","Route, level, speed, alternates, aircraft registration and equipment codes (RNAV, RVSM).","A repetitive flight plan for scheduled flights; amend for delay beyond tolerance, aircraft change or loss of equipment capability.","Air traffic control (separation), flight information (useful information), alerting (rescue services).","ATC when providing terrain clearance on a vector, but the crew always monitors MSA and challenges any clearance below it.","Squawk 7600 and follow the published procedure: keep last assigned level/speed, then the flight-planned profile and approach.","OM C §6.1 and the Algerian AIP.","Aerodrome unsafe, do not land.","Follow the interceptor’s instructions, call on 121.5 MHz, squawk 7700 unless ATC says otherwise, inform ATC.","Airprox: immediate radio report then written report. Accident: report to authorities and operator in the legal delay, protect FDR/CVR."]},{"code":"PL 02","title":"Fuel Management","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Determine the correct fuel for every flight, monitor it in flight, and take timely decisions to land with at least the final reserve.","outcomes":["Calculate the minimum block fuel and its components","Monitor fuel and detect abnormal consumption or leaks","Plan for engine-out, depressurisation and weather scenarios","Use the correct calls: MINIMUM FUEL and MAYDAY FUEL"],"refs":"OM A §8.1.5, §8.1.2.7, §8.3.7; OM B section 5; SOP §1.20; QRH (fuel imbalance, fuel leak)","sections":[{"h":"Regulatory requirement","blocks":[{"p":"The captain must ensure that the aircraft carries enough usable fuel to complete the planned flight safely, with reserves for the unexpected. The minimum is set by OM A §8.1.5. Too little fuel is dangerous; too much fuel costs money, adds mass and reduces performance margins. The captain decides, never below the minimum."}]},{"h":"Flight preparation: the minimum fuel","blocks":[{"img":"fuel.png","caption":"Composition of the fuel load (company values in OM A §8.1.5)"},{"table":{"head":["Component","Purpose","Basis"],"widths":[0.24,0.44,0.32],"rows":[["Taxi","Start-up, APU and taxi to the runway.","OFP / local conditions."],["Trip","Take-off, climb, cruise, descent, approach and landing at destination.","OFP for planned route, level, wind and mass."],["Contingency","Unforeseen factors: wind, routing, level, ATC.","Percentage of trip fuel with a minimum, per OM A."],["Destination alternate","Missed approach, climb, cruise and approach at the alternate.","One or two alternates as required (OM A §8.1.2.7)."],["Final reserve","Protected reserve: 30 min holding at 1,500 ft above the aerodrome (turbine aircraft).","Must remain on landing."],["Additional","Engine failure or depressurisation at the most critical point, or isolated aerodrome.","When the minimum does not cover these cases."],["Discretionary","Captain’s judgement: weather, traffic, expected holding.","Captain’s decision."]]}},{"p":"Isolated aerodrome: when no alternate exists, two hours of cruise fuel replace the alternate fuel (OM A §8.1.2.7). In-flight re-clearance is not used by the company."}]},{"h":"Scenarios: N engines, N-1, depressurisation and weather","blocks":[{"p":"The planned fuel covers the normal flight with all engines (N). The captain must also check that the fuel covers the critical cases from the most critical point of the route:"},{"table":{"head":["Scenario","Effect on fuel","Captain’s check"],"widths":[0.22,0.4,0.38],"rows":[["N-1 (engine failure)","Lower level, higher drag per engine, longer time to alternate.","Fuel from the critical point to an en-route alternate."],["Depressurisation","Descent to 10,000 ft or MSA: fuel flow rises sharply.","Fuel at low level to the nearest suitable aerodrome."],["Weather","Holding, re-routing, approach delays, icing.","Discretionary fuel and choice of alternates."]]}}]},{"h":"Extra fuel and the transport coefficient","blocks":[{"p":"**Extra time fuel (ETF)** is the fuel the captain adds for expected delays or holding. Express it in minutes, not in kilograms: \"10 minutes of holding\" is easy to brief and to compare with the delay information."},{"p":"**Transport coefficient** is the extra fuel burnt to carry extra fuel. Fuel carried but not needed costs part of itself in burn. Tankering is worth it only when the price difference at destination is larger than the extra burn. The OFP or the fuel tankering tables give the coefficient for the sector."}]},{"h":"In-flight monitoring and decisions","blocks":[{"p":"Check the fuel at every waypoint and at least every 30 minutes, record it on the OFP, and compare actual with planned. Check fuel used plus fuel on board against the departure figure to detect a leak."},{"flow":{"title":"In-flight fuel decision process (OM A §8.3.7)","steps":["**Monitor:** fuel at waypoints and every 30 min; compare with the OFP; estimate fuel at arrival.","**Detect a trend:** consumption higher than plan, or fuel used + FOB ≠ departure fuel (leak).","**Assess:** expected fuel at destination below alternate fuel + final reserve? Ask ATC for delay information.","**Decide:** continue only if you can still land with at least the final reserve; otherwise divert.","**Call MINIMUM FUEL:** committed to an aerodrome and any change could mean landing below final reserve.","**Call MAYDAY MAYDAY MAYDAY FUEL:** calculated usable fuel on landing below final reserve."]}}]},{"h":"Fuel types, refuelling and documents","blocks":[{"ul":["**Fuel types:** Jet A-1 is the standard turbine fuel; check the specification on the delivery receipt. Mixing approved grades is allowed within the AFM limits (e.g. freezing point of the mix).","**Refuelling with passengers on board,** embarking or disembarking: only with the safety measures in OM A (cabin crew at stations, exits clear, communication with the refuelling crew, no-smoking).","**Defuelling:** coordinate with maintenance and record the quantity.","**Documents:** fuel receipt, technical log entry, fuel request, and a check that the uplift in litres matches the change in kilograms (density)."]}]}],"key":["Minimum fuel = taxi + trip + contingency + alternate + final reserve (+ additional). Never less.","Express extra fuel in minutes.","Check fuel every 30 minutes and look for leaks with fuel used + FOB.","Final reserve is for landing, not for planning: declare MINIMUM FUEL early, MAYDAY FUEL when below."],"questions":["List the components of the minimum block fuel.","What is the purpose of the final reserve fuel, and how much is it for a turbine aircraft?","When is additional fuel required?","What replaces the alternate fuel for an isolated aerodrome?","Why should extra fuel be expressed in minutes?","Explain the transport coefficient and when tankering is worthwhile.","How often must fuel be checked in flight, and how do you detect a leak?","What do you do if the expected fuel at destination falls below alternate fuel plus final reserve?","When do you call MINIMUM FUEL, and when MAYDAY FUEL?","What safety measures apply when refuelling with passengers on board?"],"answers":["Taxi, trip, contingency, destination alternate, final reserve, plus additional fuel if required; discretionary fuel at the captain’s choice.","A protected reserve that must remain on landing: 30 min holding at 1,500 ft above the aerodrome.","When the minimum does not cover an engine failure or depressurisation at the most critical point, or other requirements (e.g. isolated aerodrome).","Two hours of cruise fuel (OM A §8.1.2.7).","Minutes are easy to brief and compare with holding and delay information.","The extra fuel burnt to carry extra fuel; worthwhile only when the price saving exceeds the extra burn.","At every waypoint and at least every 30 min; compare fuel used + FOB with the departure fuel.","Assess traffic and weather, ask ATC for delay information, and divert if needed to land with at least the final reserve (OM A §8.3.7.3).","MINIMUM FUEL when committed and any change could mean landing below final reserve; MAYDAY FUEL when landing fuel will be below final reserve.","Cabin crew at stations, exits and evacuation routes clear, seat belts unfastened, no smoking, communication with the refuelling crew (OM A)."]},{"code":"PL 03","title":"Meteorology","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Build and update the meteorological file, interpret every weather product, and apply the correct conduct for dangerous phenomena on the company network.","outcomes":["Decode METAR, TAF, SIGMET and runway condition reports","Recognise and avoid thunderstorms, icing, turbulence and windshear","Understand jet streams and the tropopause","Use in-flight weather sources and make the required reports"],"refs":"OM A §8.1.4, §8.3.8; OM B §1.8 (crosswind and contaminated runway limits); SOP §3.14 (windshear)","sections":[{"h":"The meteorological file","blocks":[{"p":"A complete weather file is a legal requirement before departure. It contains the current reports and forecasts for departure, destination and alternates, en-route significant weather and wind/temperature charts, SIGMETs, and runway condition information. If the departure is delayed, the captain updates the file: a TAF can change, and a METAR is only valid for the time it describes."}]},{"h":"Weather charts and messages","blocks":[{"table":{"head":["Product","Content","Validity / issue"],"widths":[0.2,0.5,0.3],"rows":[["METAR / SPECI","Observed weather at an aerodrome.","Routine every 30 or 60 min; SPECI for a significant change."],["TAF","Aerodrome forecast with change groups (BECMG, TEMPO, PROB).","Typically 9 to 30 hours."],["TREND","Two-hour landing forecast added to a METAR.","2 hours."],["SIGMET","Hazardous en-route weather: thunderstorms, severe icing or turbulence, volcanic ash, dust/sand storms.","Up to 4 hours (6 for volcanic ash and cyclones)."],["SIGWX chart","Significant weather: jet streams, CB areas, turbulence, icing, tropopause.","Fixed validity times."],["Wind/temperature charts","Winds and temperatures at flight levels.","Fixed validity times."]]}},{"p":"On the Algerian network, pay special attention to **dust and sand storms** (visibility can fall within minutes), **fog** at coastal aerodromes in the early morning, **high temperatures** in the south that reduce performance, and summer **thunderstorms** over the mountains."}]},{"h":"Contaminated runways","blocks":[{"p":"Runway condition reports (SNOWTAM and the runway condition code in METAR or ATIS) describe the contaminant, its depth and coverage for each third of the runway. The captain converts them into a landing or take-off decision using the OM B limits and performance data."},{"table":{"head":["Q400 limit (OM B §1.8)","Value"],"widths":[0.6,0.4],"rows":[["Crosswind: dry or wet runway","32 kt"],["Crosswind: standing water, slush, loose snow","14 kt"],["Crosswind: compacted snow","20 kt"],["Maximum contaminant depth","6 cm"],["Maximum equivalent water depth","15 mm"],["Reduced power take-off on a contaminated runway","Prohibited"]]}}]},{"h":"Dangerous phenomena and the conduct to maintain","blocks":[{"img":"microburst.png","caption":"Microburst: increasing-performance shear followed by decreasing-performance shear"},{"table":{"head":["Phenomenon","Danger","Conduct to maintain"],"widths":[0.18,0.37,0.45],"rows":[["Thunderstorm (CB)","Severe turbulence, hail, lightning, windshear, icing.","Avoid by at least 20 NM laterally (upwind side); never fly under a CB; delay take-off or approach."],["Icing","Loss of lift, increased drag and stall speed.","Anti-ice/de-ice systems per SOP; leave the icing layer; use icing speeds."],["Turbulence","Injuries, structural loads, loss of control.","Turbulence speed, seat belt sign early, secure the cabin, PA."],["Windshear","Sudden loss of airspeed and lift close to the ground.","Avoid; on encounter: escape manoeuvre, maximum thrust, pitch to the stick shaker, no configuration change (SOP §3.14)."]]}}]},{"h":"Jet stream and tropopause","blocks":[{"p":"The tropopause is the boundary between troposphere and stratosphere, where the temperature stops decreasing with height. In ISA it is at 36,090 ft; in practice it is higher over the tropics and lower over the poles. Jet streams are bands of strong wind (above 60 kt) just below the tropopause, with clear-air turbulence on their edges, especially on the cold (polar) side."},{"p":"Practical use: the SIGWX chart shows the tropopause height and jet axes. For the B737-800 the cruise is often near the tropopause; choose a level that avoids the jet core turbulence or exploits a tailwind. For the Q400 (ceiling 25,000–27,000 ft) the jet stream matters mainly through strong headwinds and turbulence."}]},{"h":"In-flight weather and reports","blocks":[{"ul":["**Sources in flight:** VOLMET, ATIS, flight information service, company (CCO), ACARS where fitted, weather radar.","**Reports:** special air reports for severe turbulence, severe icing, windshear, volcanic ash.","**Lightning strike and bird strike:** report to ATC and in the technical log; maintenance inspection required before the next flight."]}]}],"key":["Update the weather file when the departure is delayed.","Watch for dust storms, fog, heat and thunderstorms on the company network.","Avoid CBs by at least 20 NM; never fly under one.","Windshear: avoid; if encountered, fly the escape manoeuvre without changing configuration.","Report lightning and bird strikes in the technical log."],"questions":["What must the meteorological file contain before departure?","Decode: TEMPO 1418 3000 DU. What does it mean for your flight?","What is a SIGMET and how long is it valid?","Which four weather threats are typical of the Algerian network?","Give the Q400 crosswind limit for a runway covered with slush.","What is the minimum lateral distance to avoid a thunderstorm, and on which side?","Describe the three phases of a microburst encounter on approach.","What is the windshear escape technique?","Where is the tropopause in ISA, and where is turbulence found around a jet stream?","What must you do after a lightning strike?"],"answers":["Reports and forecasts for departure, destination and alternates, SIGWX and wind/temperature charts, SIGMETs, runway condition information.","Temporarily between 14:00 and 18:00 UTC, visibility 3,000 m in dust: check minima and alternate for the arrival time.","A warning of hazardous en-route weather (CB, severe icing/turbulence, volcanic ash, dust storm); up to 4 hours (6 for volcanic ash/cyclone).","Dust/sand storms, fog, high temperatures, thunderstorms.","14 kt (OM B §1.8.1.1).","At least 20 NM, preferably on the upwind side.","Headwind (IAS increases, above path), downdraft, then tailwind (IAS and lift lost, sink).","Maximum thrust, pitch towards the stick shaker, no configuration change until clear, then report (SOP §3.14).","At 36,090 ft; clear-air turbulence on the edges of the jet, especially the polar (cold) side.","Report to ATC, enter it in the technical log; a maintenance inspection is required before the next flight."]},{"code":"PL 04","title":"Operational Minimums","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Determine and apply take-off and landing minima, choose alternates correctly, and understand the captain’s responsibility for standard and reduced minima.","outcomes":["Apply take-off minima and select a take-off alternate","Distinguish precision and non-precision approaches","Apply landing minima and visual manoeuvre (circling) limits","Explain airport lighting and its effect on required visibility"],"refs":"OM A §8.1.3; OM C section 2 (minima), §2.3 (aircraft category), §11 (aerodrome categories); OM B §1.2 (Q400 CAT I only)","sections":[{"h":"Definitions","blocks":[{"p":"**Meteorological minima** are the weather values (RVR/visibility, ceiling) below which an operation may not start or continue. **Technical piloting minima** are the limits of the crew qualification and aircraft equipment, for example CAT I for the Q400 (OM B §1.2). The applicable minimum is always the **highest** of the aerodrome, operator and crew/aircraft values."},{"table":{"head":["Term","Meaning"],"widths":[0.25,0.75],"rows":[["DA / DH","Decision altitude/height: on a precision or 3D approach, the point where the go-around must start if the required visual reference is not established."],["MDA / MDH","Minimum descent altitude/height: on a non-precision (2D) approach, the level below which you may not descend without visual reference."],["RVR","Runway visual range: the distance the pilot can see runway markings or lights along the runway."],["CMV","Converted meteorological visibility, used when RVR is not available."]]}}]},{"h":"Aircraft approach categories","blocks":[{"p":"The aircraft category is based on 1.3 × VS0 (or VREF) at maximum landing mass (OM C §2.3). It fixes circling minima and the protected area of the procedure."},{"table":{"head":["Category","VAT (kt)","Typical company aircraft"],"widths":[0.25,0.3,0.45],"rows":[["A","\u003c 91","—"],["B","91–120","Dash 8-Q400 (check OM C §2.3)"],["C","121–140","B737-800"],["D","141–165","—"]]}}]},{"h":"Take-off minima and take-off alternate","blocks":[{"p":"Take-off minima are published in OM C and on the aerodrome charts as RVR/visibility, depending on runway lighting and markings. A take-off alternate is required when the departure aerodrome cannot be used for return (weather below landing minima or other reason). It must be within the distance set in OM A §8.1.2.2 (one hour at one-engine-inoperative cruise speed for two-engine aircraft is the EASA standard) and its weather must be at or above the applicable landing minima during the period of use."}]},{"h":"Approach classification and landing minima","blocks":[{"img":"minima.png","caption":"Decision point on a precision approach (DA) and on a non-precision approach (MDA, MAPt)"},{"ul":["**Precision approach (ILS CAT I):** DH not lower than 200 ft, RVR not less than 550 m (EASA standard; company values in OM C).","**Non-precision (VOR, NDB, RNP LNAV):** fly a continuous descent final approach (CDFA) where possible; the MDA is not to be used as a level-off altitude in CDFA.","**RNP APCH LNAV/VNAV** (B737-800): flown to a DA like a precision approach."]}]},{"h":"Visual manoeuvres","blocks":[{"p":"A **free visual manoeuvre** (circling) keeps the runway in sight within the protected area of the aircraft category. An **imposed visual manoeuvre** follows a prescribed track published on the chart. Lose visual reference during circling: initiate the missed approach towards the landing runway, then follow the published missed approach."}]},{"h":"Procedure design and airport lighting","blocks":[{"p":"Instrument procedures are designed (ICAO PANS-OPS) with obstacle clearance margins in each segment. Minima depend on the obstacle clearance height and on the visual aids. Better lighting reduces the required RVR."},{"table":{"head":["Lighting facility","Description","Effect on minima"],"widths":[0.24,0.46,0.3],"rows":[["FALS (full)","Precision approach lighting 720 m or more, with centre line and crossbars.","Lowest RVR."],["IALS","Intermediate system, 420–719 m.","Higher RVR."],["BALS","Basic system, 210–419 m.","Higher RVR."],["NALS","No or less than 210 m.","Highest RVR."]]}}]},{"h":"The captain’s responsibility","blocks":[{"warn":"The captain alone decides to start an approach and to continue below DA/MDA. Reduced minima (lower than standard) may only be used when the aerodrome, aircraft, crew qualification and company approval all allow it. The Q400 is CAT I only: low visibility procedures do not apply (SOP §1.35)."}]}],"key":["The applicable minimum is the highest of aerodrome, operator and crew/aircraft values.","DA is a decision point; MDA is a floor.","Take-off alternate within one hour OEI and with weather at or above landing minima.","Lose visual reference while circling: turn towards the runway and go around."],"questions":["Define DA and MDA, and give the main difference in their use.","How is the applicable minimum determined when aerodrome, operator and crew values differ?","How is the aircraft approach category determined?","When is a take-off alternate required, and what are its conditions?","What is CDFA and why is it preferred?","What are the standard EASA CAT I minima?","Which approach capability does the Q400 have, and what does it mean for low visibility operations?","What is the difference between a free and an imposed visual manoeuvre?","What do you do if you lose visual reference during a circling approach?","How does approach lighting affect the required RVR?"],"answers":["DA: altitude at which the go-around must start without visual reference (precision/3D). MDA: level below which you may not descend without visual reference (2D).","The highest of the values applies.","From VAT = 1.3 × VS0 (or VREF) at maximum landing mass (OM C §2.3).","When the departure aerodrome cannot be used for return; within one hour OEI cruise and with weather at or above landing minima.","Continuous descent final approach: a stable descent without level-off, reducing CFIT risk.","DH not lower than 200 ft and RVR not less than 550 m.","CAT I only (OM B §1.2); low visibility procedures do not apply (SOP §1.35).","Free: circling within the protected area with the runway in sight. Imposed: following a prescribed published track.","Turn towards the landing runway, climb and follow the published missed approach.","Better (longer) lighting gives lower RVR minima; less lighting requires higher RVR."]},{"code":"PL 06","title":"Mass and Balance","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Control the loading of the aircraft so that mass and centre of gravity stay within limits at every phase of flight, and accept or reject the loadsheet with full knowledge.","outcomes":["Define the structural and performance mass limits","Calculate the offered load and maximum practical load","Check passengers, baggage and freight figures and stowage","Verify a loadsheet, manage last-minute changes and the CG"],"refs":"OM A §8.1.6 (mass and balance, LMC limits), §8.1.10; OM B sections 6 and 7 (weight and balance, loading); OM A §1.4.3","sections":[{"h":"Mass definitions and limitations","blocks":[{"table":{"head":["Term","Definition"],"widths":[0.3,0.7],"rows":[["DOM (Dry operating mass)","Basic empty mass + crew, crew baggage, catering, removable passenger service equipment, potable water."],["ZFM (Zero fuel mass)","DOM + traffic load (passengers, baggage, cargo). Limited by MZFM (wing bending)."],["TOM (Take-off mass)","ZFM + take-off fuel. Limited by MTOM structural and by performance (runway, climb, obstacles, brake energy)."],["LM (Landing mass)","TOM − trip fuel. Limited by MLM structural and by landing performance."],["Traffic load","Passengers, baggage, cargo and mail."]]}},{"p":"The **regulated take-off mass** is the lowest of: structural MTOM, performance-limited TOM, MZFM + take-off fuel, and MLM + trip fuel. Each limitation protects a different part of the flight."}]},{"h":"Offered load and maximum practical load","blocks":[{"p":"**Offered (allowed) traffic load** = regulated take-off mass − DOM − take-off fuel. It is the maximum the commercial department may sell on the day. The **maximum practical load** also accounts for volume limits, seat count, hold limits and the CG."},{"table":{"head":["Example (illustrative values)","kg"],"widths":[0.7,0.3],"firstBold":false,"rows":[["Structural MTOM","29 257"],["Performance-limited TOM (hot day, short runway)","27 800"],["MLM + trip fuel (21 319 + 1 400)","22 719"],["MZFM + take-off fuel (25 855 + 2 600)","28 455"],["**Regulated TOM (lowest)**","**22 719**"],["− DOM","17 600"],["− Take-off fuel","2 600"],["**Offered traffic load**","**2 519**"]]}}]},{"h":"Passengers, baggage and freight","blocks":[{"ul":["**Passengers:** counted by category (adult, child, infant). Mass by standard values in OM A or by actual weighing when standard masses are not appropriate (e.g. sports teams, special groups).","**Baggage:** standard or actual mass; check the number of pieces against the loading message.","**Holds:** classified by fire protection (detection and suppression); each hold has a maximum mass and floor loading.","**Freight:** classified (general, perishable, valuable, live animals, dangerous goods); secured by nets and lashing (arrimage) so it cannot move in turbulence or on landing."]}]},{"h":"The loadsheet and last-minute changes","blocks":[{"flow":{"title":"Captain’s loadsheet check","steps":["**Identity:** flight number, date, registration, crew composition and DOM/DOI match the aircraft.","**Load:** passengers by category and per zone, baggage and cargo per hold match the loading instruction and NOTOC.","**Fuel:** take-off fuel and trip fuel match the OFP and fuel on board.","**Limits:** ZFM, TOM and LM below the regulated limits; margins shown.","**CG:** ZFM and TOM CG inside the envelope; trim setting derived.","**LMC:** changes within the company tolerance; otherwise a new loadsheet.","**Sign:** the captain signs only when every figure is checked (OM A §1.4.3)."]}},{"warn":"Last-minute changes (LMC) are limited by OM A §8.1.6. A change above the tolerance in passengers or hold load requires a new loadsheet. Never take off on figures you have not checked."}]},{"h":"Centre of gravity and the index system","blocks":[{"img":"cg.png","caption":"Centre of gravity envelope (illustrative; use the OM B chart for the aircraft)"},{"p":"The CG is the point where the total mass acts. It is expressed in % of the mean aerodynamic chord (MAC). To avoid long calculations, loadsheets use an **index**: a scaled moment. Each item added changes the index by a published value; the final index is converted to %MAC on the envelope chart."},{"table":{"head":["CG position","Effect"],"widths":[0.25,0.75],"rows":[["Forward CG","More stable; higher stall speed, more tailplane down-force, higher fuel consumption; heavier rotation."],["Aft CG","Less stable; lower fuel burn; risk of reduced elevator authority, tail tipping on the ground (Q400: watch the boarding sequence)."]]}},{"p":"CG variations: fuel burn moves the CG in flight; passengers moving or cargo shifting also move it. A CG derogation (outside standard seating) must be handled by an LMC and a new CG check. On the B737-800, the optimum cruise level is slightly higher with an aft CG because of reduced trim drag."}]}],"key":["The regulated TOM is the lowest of the structural and performance limits.","Offered load = regulated TOM − DOM − take-off fuel.","Check identity, load, fuel, limits and CG before you sign.","LMC above tolerance = new loadsheet."],"questions":["Define DOM, ZFM, TOM and LM.","Which four values limit the regulated take-off mass?","What does MZFM protect?","How is the offered traffic load calculated?","When must passengers be weighed instead of using standard masses?","Why must freight be secured, and how?","List the checks you make before signing the loadsheet.","What happens if a last-minute change exceeds the company tolerance?","What is an index, and why is it used?","Give two effects of a forward CG and two of an aft CG."],"answers":["DOM: empty mass + crew and operating items. ZFM: DOM + traffic load. TOM: ZFM + take-off fuel. LM: TOM − trip fuel.","Structural MTOM, performance-limited TOM, MZFM + take-off fuel, MLM + trip fuel.","The wing root against bending: fuel in the wings relieves the load, so mass without fuel is limited.","Regulated TOM − DOM − take-off fuel.","When standard masses are not representative (e.g. sports teams, special groups), per OM A.","So it cannot move in turbulence or landing and shift the CG or cause damage; by nets, lashing and correct hold loading.","Identity/DOI, load per zone and hold, fuel, mass limits and margins, CG and trim, LMC within tolerance, then sign.","A new loadsheet is required (OM A §8.1.6).","A scaled moment; it replaces long moment calculations with simple additions.","Forward: higher stall speed and fuel burn, heavy rotation. Aft: reduced stability and elevator authority, tail tipping risk on ground."]},{"code":"PL 07","title":"Aerotechnics","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Understand the aerodynamic and propulsive principles behind the flight envelope, cruise regimes, ceilings, gradients and Mach limits, and use them in operational decisions.","outcomes":["Explain load factor and the manoeuvre and gust envelope","Use the polar curve and the thrust/drag diagram","Choose a cruise regime and an optimum level","Relate gradient, speed and acceleration; recognise buffet margins"],"refs":"OM B section 1 (limitations) and section 12 (systems); AFM; FCOM/AOM; OM B 737 §1.7.2 (VMO 340 kt, MMO 0.82)","sections":[{"h":"Load factor and design speeds","blocks":[{"p":"The **load factor** n is lift divided by weight. In level flight n = 1; in a level turn n = 1 / cos(bank): 1.15 at 30°, 1.41 at 45°, 2 at 60°. The stall speed increases with the square root of n: at 45° bank the stall speed is about 19% higher."},{"table":{"head":["Speed","Meaning"],"widths":[0.2,0.8],"rows":[["VS / VS1g","Stall speed (reference stall speed at 1 g)."],["VA","Design manoeuvring speed: full control deflection without exceeding structural limits (one axis at a time)."],["VB / VRA","Turbulence penetration speed: protects against stall and structural overload in gusts."],["VMO / MMO","Maximum operating speed / Mach number."],["VD / MD","Design dive speed: demonstrated in certification, never to be used in service."]]}}]},{"h":"Flight envelope: manoeuvre and gust","blocks":[{"p":"The flight envelope (V-n diagram) shows the safe combinations of speed and load factor. Transport aircraft are certified for +2.5 g / −1 g with flaps up. The **gust envelope** adds the loads caused by vertical gusts: the faster the aircraft, the higher the load from the same gust. Consequence: in severe turbulence fly the turbulence speed, not a high speed and not a low one."}]},{"h":"Polar curve and special points","blocks":[{"p":"The polar curve plots lift coefficient against drag coefficient. Its special points are used every day:"},{"table":{"head":["Point","Operational meaning"],"widths":[0.3,0.7],"rows":[["Maximum lift/drag (L/D max)","Minimum drag speed VMD; best glide and maximum endurance for a jet; basis of the driftdown speed."],["Maximum CL","Stall."],["Minimum power","Maximum endurance for a propeller aircraft (below VMD)."],["Tangent from the origin","Best range speed (Carson speed for jets is about 1.32 × VMD)."]]}}]},{"h":"Thrust diagram","blocks":[{"img":"thrust.png","caption":"Thrust required (drag) and thrust available"},{"p":"Thrust required (drag) is U-shaped: induced drag dominates at low speed, parasite drag at high speed. The difference between thrust available and thrust required is the **excess thrust**, which gives the climb gradient. With more mass or higher altitude the drag curve moves up and the excess thrust shrinks."},{"warn":"Below VMD the aircraft is on the back of the drag curve: a speed loss increases drag and the speed keeps decreasing. Close to the ground with an engine failure this is critical: keep the target speed."}]},{"h":"Cruise regimes and altitudes","blocks":[{"table":{"head":["Regime","Principle","When used"],"widths":[0.22,0.48,0.3],"rows":[["Maximum range (MRC)","Maximum distance per kg of fuel.","Fuel critical, diversion."],["Long range (LRC)","About 1% less range than MRC for a few % more speed.","Standard when time is not critical."],["Economy (cost index)","Balance of time costs and fuel costs.","Normal company operation (B737-800)."],["Maximum endurance","Minimum fuel flow per hour.","Holding."]]}},{"ul":["**Aerodynamic ceiling:** the level where the margin between low-speed and high-speed buffet becomes too small (coffin corner).","**Propulsive ceiling:** the level where maximum thrust only equals drag (no climb capability left).","**Optimum altitude:** the level giving the best specific range for the current mass; it rises as fuel burns. Cruise about 2,000 ft below or near optimum, within the buffet margin (usually 1.3 g)."]}]},{"h":"Gradients and Mach limits","blocks":[{"p":"**Air gradient** is the climb angle relative to the air mass; **ground gradient** is relative to the ground and changes with wind (headwind improves it, tailwind worsens it). Air gradient ≈ (thrust − drag) / weight. Excess thrust used to accelerate cannot be used to climb: accelerating reduces the gradient, which is why the third take-off segment is flown level."},{"p":"At high Mach, local supersonic flow creates shock waves and **Mach buffet**. Exceeding MMO also brings a nose-down tendency (Mach tuck) on swept-wing aircraft. Respect MMO and the buffet boundary, especially in turbulence and at high altitude with high mass."}]}],"key":["Load factor in a turn = 1/cos(bank); stall speed rises with √n.","Fly turbulence speed in severe turbulence.","Below VMD, speed is unstable: hold the target speed.","Excess thrust gives climb; accelerating costs gradient.","Stay within the buffet margin near the ceiling."],"questions":["What is the load factor in a level 60° bank turn, and how much does the stall speed increase?","Define VA and VB/VRA.","Why is the turbulence speed neither high nor low?","What does the point L/D max on the polar give you?","What happens to an aircraft flown below VMD?","What is excess thrust and what does it give?","Compare MRC and LRC.","Define aerodynamic ceiling and propulsive ceiling.","How does wind affect the ground gradient?","What is Mach buffet and how is it avoided?"],"answers":["n = 2; stall speed increases by √2, about 41%.","VA: full deflection without structural overload. VB/VRA: speed for turbulence penetration.","Too fast increases gust loads; too slow reduces the stall margin.","Minimum drag speed VMD: best glide, jet endurance, driftdown basis.","It is on the back of the drag curve: speed is unstable and decreases further unless thrust is added.","Thrust available minus thrust required; it gives climb gradient or acceleration.","MRC gives maximum range; LRC gives about 1% less range for a higher speed.","Aerodynamic: buffet margin too small. Propulsive: max thrust equals drag, no climb left.","Headwind increases the ground gradient; tailwind reduces it.","Buffet from shock waves at high Mach; respect MMO and the 1.3 g buffet margin."]},{"code":"PL 09","title":"Aircraft Performance","phase":"Phase 2 — Flight preparation, weather and performance","aim":"Calculate and apply take-off, en-route and landing performance, including contaminated runways, reduced thrust and system failures, so that every flight respects the regulatory margins.","outcomes":["Use IAS, CAS, TAS and the take-off speeds correctly","Explain the take-off segments and obstacle clearance","Apply en-route and landing limits, dry and contaminated","Calculate reduced thrust and the penalties of system failures"],"refs":"OM B section 4 and §1.10; OM A §8.1.2.11, §8.1.2.12; OM B §1.8 (runway limits); OM B 737 §1.8.3.1","sections":[{"h":"Speeds and definitions","blocks":[{"table":{"head":["Speed","Definition"],"widths":[0.18,0.82],"rows":[["IAS / CAS / TAS","Indicated; calibrated (IAS corrected for instrument and position error); true (CAS corrected for density). TAS increases with altitude at constant IAS."],["VEF","Speed at which the critical engine is assumed to fail."],["V1","Decision speed: the maximum speed to start a rejected take-off, and the minimum speed to continue after an engine failure."],["VR","Rotation speed."],["V2","Take-off safety speed, reached by 35 ft with one engine inoperative."],["VMCG / VMCA","Minimum control speeds on the ground / in the air with the critical engine inoperative."],["VREF","Reference landing speed at 50 ft."]]}},{"p":"Performance is calculated for the **critical temperature**, pressure altitude, wind (50% of headwind and 150% of tailwind are used in certified data), runway slope and surface condition."}]},{"h":"Take-off: distances and segments","blocks":[{"p":"Take-off distance available (TODA), take-off run available (TORA) and accelerate-stop distance available (ASDA) must cover the required distances for an engine failure at VEF and for all-engines operation. The heaviest limit among field length, climb, obstacles, tyre speed and brake energy gives the performance-limited take-off mass."},{"img":"tosegments.png","caption":"One-engine-inoperative take-off flight path and net path"},{"table":{"head":["Segment","Configuration","Minimum gross gradient, twin"],"widths":[0.2,0.5,0.3],"rows":[["1st","Gear retracting, take-off flap, take-off thrust","Positive"],["2nd","Gear up, take-off flap, V2","2.4%"],["3rd","Level acceleration, flap retraction","Level"],["Final","Clean, maximum continuous thrust","1.2%"]]}},{"p":"The **net** path is the gross path reduced by 0.8% for a twin. The net path must clear every obstacle by 35 ft vertically."}]},{"h":"Contaminated runways and reduced thrust","blocks":[{"table":{"head":["Item","Dash 8-Q400","B737-800"],"widths":[0.26,0.37,0.37],"rows":[["Contaminated runway take-off","Reduced power prohibited; max 6 cm contaminant, 15 mm water equivalent, up to 6,000 ft.","Fixed derate allowed; assumed temperature not allowed; not recommended above 13 mm slush/water or 102 mm dry snow."],["Runway slope","±2%","±2%"]]}},{"p":"**Reduced (flexible) thrust** uses an assumed temperature higher than the actual one: the engines deliver less thrust, which saves engine life. **Derated thrust** is a lower certified rating with its own (lower) VMCG, useful on short or contaminated runways."},{"warn":"Cancel reduced thrust when: the runway is contaminated (Q400), windshear is suspected, anti-skid is inoperative (if required by OM B/MEL), or any performance doubt exists. Applying full thrust after V1 is always permitted."}]},{"h":"En-route: obstacle clearance and critical point","blocks":[{"p":"After an engine failure in cruise, the aircraft drifts down to a lower level. The net driftdown path must clear obstacles by 1,000 ft in level flight and 2,000 ft while descending (EASA). Two methods are used: the **classical rule** (the net path stays above all obstacles along the route) and the **driftdown rule** (the aircraft can descend towards a suitable aerodrome while clearing obstacles)."},{"p":"**Critical point** of the route: the point from which the diversion after an engine failure or depressurisation is the most demanding. **Critical mass:** the highest mass at which the aircraft can still clear the terrain at that point."}]},{"h":"Landing performance","blocks":[{"ul":["**Approach climb:** with one engine inoperative in approach configuration (2.1% gross for a twin) — limits the landing mass at hot and high aerodromes.","**Landing climb:** all engines, landing configuration, go-around thrust (3.2% gross).","**Landing distance:** the certified distance is factored for dispatch (dry runway: 60% of the landing distance available; wet: +15%). For a turboprop, OM A §8.1.2.7 applies a specific factor.","**In flight:** reassess the landing distance before 1,000 ft with the actual conditions (OM A §8.1.2.11); do not continue if the data do not show a safe landing."]}]},{"h":"Payload of the day and system failures","blocks":[{"p":"The **maximum payload of the day** results from the lowest of the take-off, en-route and landing limits, minus DOM and fuel (see PL 06). On hot days in the south of the network the climb limit often decides."},{"table":{"head":["Failure","Typical performance penalty (always use OM B/MEL data)"],"widths":[0.25,0.75],"rows":[["Anti-skid inoperative","Large increase in ASDR and landing distance; lower V1; contaminated runway may be prohibited."],["Spoilers / ground spoilers","Longer landing and accelerate-stop distances."],["Speed brakes","Longer descent and higher approach energy; landing distance penalty."],["Flaps / slats","Higher approach speed and landing distance (see PL 16)."]]}}]}],"key":["V1 is a decision speed: before it you may stop, after it you go.","The net path clears obstacles by 35 ft; the second segment usually limits.","Never use reduced power on a contaminated runway on the Q400.","Reassess landing distance before 1,000 ft.","System failures change performance: check the MEL and OM B data."],"questions":["Define V1, VR, V2 and VMCG.","Why are 50% of headwind and 150% of tailwind used in performance calculations?","Which factors can limit the take-off mass?","Describe the four take-off segments and the minimum gradient of the second segment for a twin.","What is the difference between gross and net path?","When is reduced power prohibited on the Q400?","What is the difference between assumed temperature and derated thrust?","What is the critical point of a route?","What is the approach climb requirement and why does it matter?","When must you reassess landing distance in flight, and what is the rule if it is not safe?"],"answers":["V1: decision speed. VR: rotation. V2: take-off safety speed at 35 ft OEI. VMCG: minimum control speed on ground with critical engine failed.","To add a safety margin for wind errors.","Field length, climb gradient, obstacles, tyre speed, brake energy, and structural limits.","1st: gear retracting; 2nd: gear up, T/O flap, V2, 2.4%; 3rd: level acceleration; final: clean, MCT, 1.2%.","The net path is the gross path reduced by a margin (0.8% for a twin) and must clear obstacles by 35 ft.","On contaminated runways (OM B §1.8.4).","Assumed temperature reduces thrust within the normal rating; derate is a lower certified rating with lower VMCG.","The point from which a diversion after engine failure or depressurisation is the most demanding.","2.1% gross OEI in approach configuration; it limits landing mass at hot and high aerodromes and protects the go-around.","Before 1,000 ft above aerodrome elevation; do not continue below 1,000 ft if a safe landing is not shown (OM A §8.1.2.11)."]},{"code":"PL 05","title":"Navigation","phase":"Phase 3 — In-flight management and navigation","aim":"Master the navigation systems and methods used on the network, including altimetry, critical points, RVSM and TCAS, and manage degraded situations.","outcomes":["Use charts, routes and conventional navaids correctly","Explain IRS and GPS principles and errors","Apply altimeter setting rules and cold-temperature corrections","Calculate ETP and PNR; manage RVSM and TCAS"],"refs":"OM A §8.3.2, §8.3.3; OM C sections 1, 3 and 10; OM B §1.2 (navigation approvals); SOP §3.12 (TCAS); AFM Supplement 73; Jeppesen","sections":[{"h":"Charts and routes","blocks":[{"p":"En-route charts use the **Lambert conformal** projection: a straight line is close to a great circle and scale is nearly constant. Polar areas use the polar stereographic projection. The **orthodromic** route (great circle) is the shortest; the **loxodromic** route (rhumb line) keeps a constant true track. On the domestic network the difference is small; for long sectors the FMS flies great circle legs between waypoints."}]},{"h":"Navigation systems","blocks":[{"table":{"head":["System","Principle","Frequency / range","Main errors"],"widths":[0.13,0.33,0.24,0.3],"rows":[["VOR","Phase comparison gives a magnetic radial.","108–117.95 MHz; line of sight.","Site and propagation errors, scalloping, cone of confusion overhead."],["DME","Pulse timing gives slant range.","962–1213 MHz; line of sight.","Slant range error close to the station."],["ADF/NDB","Loop antenna gives relative bearing.","190–1750 kHz; ground wave.","Night effect, thunderstorms, coastal and mountain effect."],["ILS","Localiser and glide slope beams.","LOC 108.1–111.95 MHz; GS UHF paired.","False glide slopes above the true path; beam bends; protect the critical areas."],["IRS","Accelerometers and laser gyros integrate position.","Self-contained.","Drift with time (typically up to 2 NM/h); needs correct alignment."],["GPS","Ranging from satellites; at least 4 for 3D position.","Global.","Satellite geometry, jamming and spoofing; RAIM required for integrity."]]}},{"warn":"GPS jamming and spoofing are reported in the region. Cross-check GPS position against conventional navaids, and know how to revert to conventional navigation if integrity is lost."}]},{"h":"Altimetry","blocks":[{"table":{"head":["Setting","Use"],"widths":[0.2,0.8],"rows":[["QNH","Altitude above mean sea level: below the transition altitude."],["QFE","Height above the aerodrome (where used)."],["Standard 1013.25 hPa","Flight levels: above the transition level."]]}},{"ul":["**Cold temperature:** a true altitude lower than indicated. Apply the cold temperature correction to minimum altitudes and DA/MDA when the aerodrome temperature is below the value published by the State.","**Tolerances:** check altimeters on the ground (agreement with QNH and with each other) and in RVSM (±200 ft between primary altimeters)
