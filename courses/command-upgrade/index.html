.","**\"High to low, look out below\":** flying towards a low-pressure area or into colder air with an unchanged setting, the aircraft is lower than indicated."]}]},{"h":"Equal-time point and point of no return","blocks":[{"img":"etp.png","caption":"Equal-time point (ETP) and point of no return (PNR)"},{"p":"The **ETP** is the point from which the time to continue equals the time to return (or to reach two alternates). It is calculated with the ground speeds of the scenario: all engines, engine failure or depressurisation. The **PNR** is the furthest point from which the aircraft can return to the departure (or alternate) aerodrome with the required reserves. Use them on long sectors over the desert, where alternates are far apart."}]},{"h":"RVSM and TCAS","blocks":[{"p":"**RVSM** (FL290–FL410) reduces vertical separation to 1,000 ft. It requires two independent altitude measuring systems, an altitude alerting system, an automatic altitude control system and a transponder with altitude reporting. The B737-800 is RVSM approved; the Q400 operates below RVSM levels."},{"ul":["Degraded RVSM (loss of one required system, severe turbulence): inform ATC (\"unable RVSM due equipment\"), expect a non-RVSM level or extra separation.","Altimeter check before entering RVSM airspace; record the readings."]},{"p":"**TCAS II** interrogates other transponders (1030/1090 MHz) and gives a traffic advisory (TA) and resolution advisory (RA). On a TA: look for the traffic and prepare. On an RA: disconnect the autopilot if required, follow the RA promptly and smoothly, inform ATC (\"TCAS RA\"), and return to the clearance when \"clear of conflict\" (SOP §3.12). Never manoeuvre against an RA."}]}],"key":["Cross-check GPS against conventional navaids; expect jamming.","Apply cold temperature corrections to minimum altitudes.","Calculate ETP and PNR on long desert sectors.","RVSM needs two altimeters within 200 ft; tell ATC when unable.","Always follow a TCAS RA, even against an ATC instruction."],"questions":["What is the difference between an orthodromic and a loxodromic route?","Give two errors of the ADF and two of the VOR.","Why must you be careful with ILS false glide slopes?","What is the typical IRS drift, and why is alignment important?","How many satellites are needed for a 3D GPS position, and what is RAIM?","When must the cold temperature correction be applied?","Define ETP and PNR. Which way does a headwind on the outbound leg move the ETP?","List the equipment required for RVSM.","What is the maximum difference between primary altimeters in RVSM?","What are the crew actions on a TCAS RA?"],"answers":["Orthodromic: great circle, shortest. Loxodromic: rhumb line with constant track.","ADF: night effect, thunderstorm/coastal effect. VOR: site error, cone of confusion, scalloping.","False glide slopes exist above the true path; intercept from below and cross-check the altitude at the FAF.","Up to about 2 NM/h; a wrong alignment position gives a wrong position all flight.","Four; RAIM is the receiver’s integrity monitoring.","When the aerodrome temperature is below the value published by the State, to minimum altitudes and DA/MDA.","ETP: equal time to continue or return. PNR: last point to return with reserves. A headwind on the outbound leg moves the ETP towards the destination.","Two independent altitude systems, altitude alerting, automatic altitude control, altitude-reporting transponder.","200 ft.","Follow the RA promptly and smoothly, inform ATC, return to the clearance when clear of conflict; never manoeuvre against it."]},{"code":"PL 10","title":"Procedures","phase":"Phase 3 — In-flight management and navigation","aim":"Lead the crew through standard and abnormal procedures with clear task sharing, disciplined checklist use, precise briefings and stabilised approaches.","outcomes":["Distribute tasks between PF, PM and PIC","Run normal and non-normal checklists correctly","Brief departures and arrivals; manage altimetry","Fly approaches and go-arounds with N and N-1 engines"],"refs":"SOP chapters 1 and 2 (§1.21–1.23, §1.32–1.33, §2.3, §2.18–2.19); SOP chapter 3; QRH; OM A §8.3","sections":[{"h":"Crew coordination and task sharing","blocks":[{"table":{"head":["Role","Main tasks"],"widths":[0.2,0.8],"rows":[["PF","Flies the aircraft and manages the flight path and automation; calls for checklists and configuration changes."],["PM","Monitors flight path and systems, communicates, reads checklists, makes standard calls, challenges deviations."],["PIC","Whatever the seat or role, keeps the overall picture, takes the decisions, and redistributes tasks when the workload changes."]]}},{"p":"Zones of responsibility: each pilot is responsible for the panels and controls on their side and the shared items as defined in the SOP. Every change of a setting is announced and acknowledged (SOP §1.32.1). Below 10,000 ft the sterile flight deck rule applies."}]},{"h":"Briefings and take-off/landing cards","blocks":[{"p":"The take-off and landing cards hold the speeds, thrust and configuration calculated from the performance data. The PF briefs; the PM checks the figures independently. A good briefing is short, specific and focused on threats."},{"table":{"head":["Briefing","Must contain"],"widths":[0.22,0.78],"rows":[["Departure","Technical status and HIL items, runway and conditions, mass, thrust, flaps, speeds, SID and initial altitude, engine-out procedure, acceleration altitude, MSA, rejected take-off criteria and return plan (SOP §2.3)."],["Arrival","Weather, terrain and MSA, approach type and radio set-up, minima, missed approach, runway condition and landing distance, taxi route, threats (SOP §2.18.1)."]]}}]},{"h":"Checklist discipline and fault treatment","blocks":[{"flow":{"title":"Non-normal procedure sequence","steps":["**Fly the aircraft:** PF keeps control of the flight path; announce the failure.","**Identify:** both pilots confirm the failure on the indications.","**Memory items:** called by the PF, performed by the PM, critical actions cross-checked (SOP §1.22).","**QRH checklist:** read and do; do not skip steps; read the notes.","**Normal checklists:** complete the remaining ones.","**Decide and inform:** consequences for the flight, landing distance, ATC, cabin, company."]}},{"p":"Checklists are classified as normal, non-normal (abnormal) and emergency. A checklist is triggered by a warning, a caution or an observed condition. Read the title aloud so both pilots confirm it is the right one."}]},{"h":"Approaches, go-arounds and traffic patterns","blocks":[{"ul":["**Traffic pattern:** with take-off at the different flap settings, flown to company standards (speeds, configuration points).","**Approaches with N and N-1 engines:** ILS, VOR, NDB, RNP, visual and radar approaches; for N-1, brief the go-around and the rudder/power changes.","**Visual manoeuvres:** within the protected circling area; keep the runway in sight.","**Stabilised approach:** stable by 1,000 ft AFE in IMC and 500 ft AFE in VMC; otherwise go around. No disciplinary action for a go-around flown to meet the criteria (SOP §2.19)."]},{"table":{"head":["Stabilised approach criteria",""],"widths":[0.5,0.5],"firstBold":false,"rows":[["On the correct lateral and vertical path","Speed within the SOP tolerance"],["Landing configuration set","Sink rate not above 1,000 ft/min (unless briefed)"],["Power setting appropriate","All briefings and checklists completed"]]}}]},{"h":"Handling system failures and emergency descent","blocks":[{"p":"For flap, spoiler or anti-skid failures, apply the QRH, then recalculate approach speed and landing distance, and brief the effect on handling. The emergency descent is described in PL 17: masks on, descent initiated without delay, MAYDAY, level at 10,000 ft or MSA."}]}],"key":["PF flies, PM monitors, PIC decides.","Announce and acknowledge every change.","Memory items, then QRH, then normal checklists.","Not stable at 1,000 ft IMC / 500 ft VMC: go around."],"questions":["Describe the roles of PF, PM and PIC.","What is the sterile flight deck rule?","List six items of the departure briefing.","What must the arrival briefing contain?","Who calls and who performs memory items?","What is the sequence for a non-normal procedure?","Why do you read the checklist title aloud?","Give the stabilised approach heights in IMC and VMC.","Name four stabilised approach criteria.","What do you brief before an N-1 approach?"],"answers":["PF flies and manages the flight path; PM monitors, communicates and runs checklists; PIC decides and redistributes tasks.","Below 10,000 ft: no non-essential conversation or activity; only weather and ATC paperwork (SOP §1.32.2).","Technical status/HIL, runway, mass, thrust/flaps/speeds, SID, engine-out procedure, acceleration altitude, MSA, RTO criteria.","Weather, terrain/MSA, approach and radio set-up, minima, missed approach, runway condition and landing distance, taxi route, threats.","The PF calls; the PM performs; critical actions are cross-checked.","Fly, identify, memory items, QRH, normal checklists, decide and inform.","So both pilots confirm the correct checklist is being used.","1,000 ft AFE in IMC and 500 ft AFE in VMC.","Correct path, speed in tolerance, landing configuration, sink rate below 1,000 ft/min, power appropriate, checklists complete.","Approach speeds, configuration, rudder and power changes, go-around technique and missed approach routing."]},{"code":"PL 11","title":"Go-Around and Diversion","phase":"Phase 3 — In-flight management and navigation","aim":"Fly a precise go-around with all engines or one engine inoperative, and prepare, decide and conduct a diversion while managing fuel, weather, passengers and the company.","outcomes":["Fly the go-around technique with N and N-1 engines","Prepare alternates, alternate fuel and holding time","Take the diversion decision with the right priorities","Conduct the diversion and coordinate ground assistance"],"refs":"SOP §2.25, §3.6.4; OM A §8.1.3.12.1, §8.1.2.7, §8.3.7; OM C §13 (en-route alternates)","sections":[{"h":"Go-around technique","blocks":[{"p":"A go-around is a normal manoeuvre, not a failure. It is often flown rarely and under surprise, so it must be briefed on every approach and flown with the same precision every time."},{"flow":{"title":"Go-around: PF and PM sequence (all engines)","steps":["**PF:** \"GO AROUND, FLAPS\" — go-around thrust, pitch to the go-around attitude, follow the flight director.","**PM:** set go-around flaps, check thrust, call \"POSITIVE CLIMB\".","**PF:** \"GEAR UP\" — PM retracts the gear.","**PF:** follow the missed approach track; engage the autopilot when appropriate.","**PM:** inform ATC (\"going around\"), select navaids, monitor altitude and speed.","**At acceleration altitude:** retract flaps on schedule; after-take-off checklist."]}},{"p":"**N-1 go-around:** the same sequence with go-around thrust on the live engine, correct rudder and bank (up to 5° towards the live engine), V2/VAPP speed, and the engine-out missed approach routing if published. Manage terrain: an engine-out go-around climbs slowly."},{"warn":"A late go-around (below DA or after touchdown) is the most demanding. Do not retract the gear before a positive climb is confirmed on two indications, and do not change configuration in a windshear escape."}]},{"h":"Diversion preparation","blocks":[{"p":"Preparation starts on the ground. The captain knows the alternates, their weather, opening hours, runway, approach aids, fire category, fuel and handling. In flight, the PM computes the alternate fuel and the holding time available."},{"p":"**Holding time available** = (fuel on board − fuel to the alternate − final reserve) ÷ holding fuel flow. Example: 2,100 kg FOB, 700 kg to alternate, 600 kg final reserve, 1,000 kg/h holding → (2,100 − 700 − 600) / 1,000 = 0.8 h = 48 minutes."},{"decision":{"question":"Approach not possible at destination: continue holding or divert?","yesLabel":"HOLD (if all true)","noLabel":"DIVERT (if any true)","title":"Hold or divert","yes":["Improvement expected within the holding time available","Fuel after holding still covers alternate + final reserve","Alternate weather stable and suitable","ATC delay information is reliable"],"no":["Weather not improving or deteriorating","Holding time used reaches the decision fuel","Alternate weather deteriorating","Technical or passenger issue requires landing"]}}]},{"h":"The diversion decision","blocks":[{"p":"Safety first, then passengers and commercial factors. Choose the aerodrome with the best combination of weather, runway, approach aids, rescue services and handling. The commercial aspect (passenger care, crew duty time, aircraft position for the next day) is considered, but never at the expense of safety margins."},{"table":{"head":["Factor","Questions the captain asks"],"widths":[0.2,0.8],"rows":[["Fuel","How much fuel at arrival at each option? Margin above final reserve?"],["Weather","At or above minima with margin? Trend? Crosswind?"],["Aircraft","Technical status, landing distance with any failure?"],["Aerodrome","Open? Runway length, approach type, fire category, handling, fuel?"],["People","Passengers needs, crew duty time, onward transport?"]]}}]},{"h":"Conducting the diversion","blocks":[{"ol":["Inform ATC and obtain a clearance; set the new route in the FMS and cross-check it.","Recalculate fuel at arrival and continue fuel monitoring.","Get the latest weather and runway information at the alternate.","Inform the cabin crew and passengers (reason, new destination, time).","Inform the company (CCO) to arrange handling and passenger assistance.","Brief the new approach; check duty time; plan the next sector."]}]}],"key":["Brief the go-around on every approach.","Positive climb confirmed before gear up.","Compute holding time available and set a decision fuel.","Divert early; arriving at the alternate with margins is the aim.","Inform ATC, cabin, passengers and the CCO."],"questions":["Why should a go-around be briefed on every approach?","Give the PF calls of the go-around sequence.","What are the differences for an N-1 go-around?","What makes a late go-around dangerous?","How do you calculate the holding time available?","Calculate: FOB 2,400 kg, alternate fuel 800 kg, final reserve 600 kg, holding 1,000 kg/h.","List four conditions to continue holding instead of diverting.","How do commercial factors enter the diversion decision?","Who must be informed during a diversion?","List five checks when choosing a diversion aerodrome."],"answers":["It is flown rarely and by surprise; briefing makes it automatic and precise.","\"GO AROUND, FLAPS\", then \"GEAR UP\" after positive climb, then flap retraction calls at acceleration altitude.","Thrust on one engine, rudder and up to 5° bank towards the live engine, V2 speeds, engine-out routing, slower climb.","Low energy and height, risk of touchdown or tail strike, configuration errors and surprise.","(FOB − fuel to alternate − final reserve) ÷ holding fuel flow.","(2,400 − 800 − 600) / 1,000 = 1.0 h = 60 minutes.","Improvement expected, fuel still covers alternate + final reserve, alternate weather stable, reliable ATC delay.","Considered after safety: passenger care, duty time, aircraft position, but never reducing safety margins.","ATC, cabin crew, passengers, company (CCO).","Weather and trend, runway and approach aids, fire category, opening hours, fuel and handling."]},{"code":"PL 12","title":"Engine Failure","phase":"Phase 4 — Systems failures and abnormal operations","aim":"Manage an engine failure at every phase of flight with correct technique, crew coordination and decision making, from the rejected take-off to the one-engine-inoperative approach.","outcomes":["Decide and act correctly before and after V1","Fly the engine-out take-off path and treat the failure","Analyse an in-flight engine failure and decide where to land","Prepare and fly an N-1 approach and go-around"],"refs":"SOP §3.1, §3.6, §3.7, §3.6.4; QRH (engine failure, fire, severe damage); OM B section 4 (OEI performance)","sections":[{"h":"Generalities","blocks":[{"p":"An engine failure is the last step before a state of emergency. On a twin it halves the available thrust and removes most of the climb capability. Ask ATC for priority, and declare MAYDAY if the situation (fire, severe damage, terrain, weather) requires it."},{"box":{"title":"Golden rules","tone":"green","items":["Fly the aircraft first: attitude, rudder, speed.","No action below 400 ft except gear up (unless the SOP specifies otherwise).","Identify the failed engine on two indications before any action on a lever or switch.","Stay calm: one failure, one procedure, one pilot flying."]}}]},{"h":"Engine failure on take-off","blocks":[{"img":"rto.png","caption":"Rejected take-off decision band (Q400 SOP)"},{"p":"**Before V1: reject.** The captain calls \"ABORT\", closes the power levers, applies maximum braking and reverse as required, and stops on the runway centre line. Then: inform ATC, assess (fire, evacuation), complete the checklist, inform PNC and PAX. See PL 13."},{"p":"**After V1: continue.** Rotate at VR to the engine-out attitude, keep the heading with rudder, gear up with positive climb, fly V2 (V2 + 10 maximum), and follow the engine-out procedure (HSD or ASD routing) to the acceleration altitude. Then accelerate, retract flaps, set maximum continuous power and run the QRH."},{"flow":{"title":"After V1: from rotation to the decision","steps":["**Control:** rotate, attitude, rudder, V2; \"POSITIVE CLIMB\" — \"GEAR UP\".","**Path:** engine-out routing; acceleration altitude; flap retraction; MCP.","**Treat:** identify, memory items, QRH (engine failure, fire or severe damage).","**ATC:** MAYDAY or PAN, intentions (return, priority, diversion).","**Prepare:** reduced briefing, approach checklist, landing distance OEI.","**Inform:** PNC (NITS) and passengers; stay calm."]}}]},{"h":"Engine failure in flight","blocks":[{"ul":["**Control the path:** set maximum continuous power, keep speed, and if above the OEI ceiling start a driftdown at the driftdown speed; inform ATC.","**Checklist:** identify, memory items, QRH; consider a relight only if the QRH allows and there is no damage.","**Analyse (bilan):** aircraft status, weather, terrain and MSA, OEI ceiling, fuel, distance to suitable aerodromes.","**Decide:** continue to destination or divert to the nearest suitable aerodrome; the QRH and OM A guide this choice.","**Coordinate:** inform PNC and PAX; ask the company for support; calculate new route elements and cross-check them."]}]},{"h":"One-engine-inoperative approach and landing","blocks":[{"p":"Modify the arrival briefing: approach speed, flap setting for landing as per QRH, rudder trim, power changes, and the N-1 go-around technique. Check the landing distance OEI and the go-around gradient. Anticipate a second problem: fuel imbalance, hydraulic or electrical loss associated with the failed engine."},{"warn":"Engine failure during the approach: maintain the path with high precision, apply the checklist only when workload allows, and be ready to go around with one engine. Inform ATC of the emergency aerodromes (terrains de secours) available."}]}],"key":["Before V1 stop; after V1 go.","Identify on two indications before touching a lever.","Fly V2 and the engine-out routing; no action below 400 ft except gear.","Analyse, decide, and brief the N-1 approach and go-around.","Keep calm and keep the cabin informed."],"questions":["Why is an engine failure considered the last step before an emergency?","Who calls \"ABORT\", and what are the first actions of a rejected take-off?","What are the actions after an engine failure after V1, up to acceleration altitude?","What is the maximum speed to fly in the second segment, and why?","What must be done before acting on a power lever or fuel lever?","What is HSD or ASD routing?","What do you analyse before deciding where to land after an in-flight engine failure?","When may you attempt a relight?","What changes in the briefing for an N-1 approach?","What second failures should you anticipate after an engine failure?"],"answers":["It halves thrust and removes most climb capability; any further problem becomes an emergency.","The captain; close power levers, maximum braking, reverse as required, stop on the centre line.","Rotate, attitude, rudder, V2, positive climb gear up, engine-out routing to acceleration altitude, then accelerate and clean up.","V2 to V2 + 10: best climb gradient and obstacle clearance.","Identify the failed engine on two indications and confirm with the other pilot.","The published engine-out departure routing for terrain and obstacles.","Aircraft status, weather, terrain/MSA, OEI ceiling, fuel, suitable aerodromes.","Only if the QRH allows and there is no sign of damage or fire.","Speed, flap setting, rudder and power changes, landing distance OEI, N-1 go-around technique.","Fuel imbalance, loss of hydraulic or electrical systems driven by the failed engine."]},{"code":"PL 15","title":"Landing Gear Failure","phase":"Phase 4 — Systems failures and abnormal operations","aim":"Troubleshoot gear retraction and extension failures, evaluate gear-down flight, and prepare the crew, cabin and ATC for an abnormal landing.","outcomes":["Manage a gear retraction failure and decide to continue, return or divert","Apply gear-down flight limits and performance effects","Apply the alternate (emergency) gear extension","Prepare an abnormal landing with partial or no gear"],"refs":"QRH (gear unsafe, alternate extension); SOP chapter 3; OM B section 1 (gear limit speeds), section 4 (gear-down performance), MEL","sections":[{"h":"Gear retraction failure","blocks":[{"p":"First fly the aircraft: maintain the departure path and stay below the gear extended limit speed (VLE). Then troubleshoot with the QRH: check indications, air/ground (WOW) logic, hydraulic system and circuit breakers. Do not cycle the gear repeatedly."},{"decision":{"question":"Gear will not retract: can the flight continue gear down?","yesLabel":"CONTINUE (if all true)","noLabel":"RETURN or DIVERT","title":"Gear retraction failure decision","yes":["Gear-down flight allowed by the QRH/OM B","Fuel sufficient with gear-down drag (much higher burn)","Safety altitudes and OEI ceiling compatible with gear down","No icing and weather compatible"],"no":["Fuel or terrain not compatible","Icing or severe weather on the route","Doubt about gear structure or hydraulics","Return to departure (QRF) if weather allows"]}}]},{"h":"Gear-down flight","blocks":[{"table":{"head":["Effect","Consequence for the flight"],"widths":[0.3,0.7],"rows":[["Speed limited to VLE","Longer flight time; check duty time."],["Drag increased","Fuel burn much higher (use OM B gear-down data); range reduced."],["Ceiling reduced","Lower practical and OEI ceiling: check MSA on the whole route."],["Climb gradient reduced","Take-off and go-around limits (N-1 level-off, emergency descent profile) change."]]}},{"p":"A planned gear-down ferry flight needs the acceptance conditions: approval, reduced load, suitable weather, safety altitudes and a specific route. Inform ATC of the reduced performance."}]},{"h":"Gear extension failure","blocks":[{"flow":{"title":"Gear extension failure: crew actions","steps":["**Fly:** go around or hold at a safe altitude; PF flies, PM troubleshoots.","**QRH:** gear unsafe indication; confirm with the second indication system.","**Alternate extension:** apply the emergency (manual) extension procedure exactly as the QRH.","**Verify:** three green; ask the tower for a visual check by a low pass if doubt remains.","**Prepare:** landing distance, emergency services, cabin preparation if not locked."]}}]},{"h":"Abnormal landing: gear not extended or not locked","blocks":[{"table":{"head":["Case","Technique (follow the QRH)"],"widths":[0.25,0.75],"rows":[["Nose gear not locked","Aft CG if possible (passengers moved aft per QRH), land on the mains, hold the nose up, lower it gently before losing elevator authority; minimum braking."],["One main gear not locked","Land on the side of the good gear, keep the wing up with aileron, use rudder and nosewheel steering to stay straight; prepare for evacuation."],["All gear up","Long approach with emergency services alerted; burn fuel if required; flaps as QRH; touch down gently at low speed; shut down engines/fuel as QRH; evacuate."]]}},{"p":"Cabin: brief the senior cabin crew (NITS: nature, intentions, time, special instructions), passengers in the brace position, exits assigned. Coordinate with ATC for foam (if available) and rescue services."}]}],"key":["Fly first, below VLE; troubleshoot with the QRH.","Gear-down flight increases fuel burn and reduces ceiling.","Alternate extension exactly as the QRH; verify three green.","Prepare cabin and rescue services for any unsafe gear."],"questions":["What are your first actions after a gear retraction failure?","What is VLE?","Which conditions allow continuing a flight gear down?","Give three performance effects of gear-down flight.","What is QRF?","What is the sequence for a gear extension failure?","How can you confirm a doubtful gear position?","What technique do you use for a nose gear not locked?","What technique do you use for one main gear not locked?","What is NITS?"],"answers":["Fly the departure path below VLE, then troubleshoot with the QRH; do not cycle the gear repeatedly.","The maximum speed with the gear extended.","Allowed by QRH/OM B, enough fuel with extra drag, compatible MSA and OEI ceiling, no icing.","Higher fuel burn, reduced ceiling, reduced climb gradient (and lower speed).","Quick return to the departure aerodrome.","Fly/hold safely, QRH, alternate extension, verify, prepare landing and cabin.","Second indication system, tower visual check by low pass, gear viewer if fitted.","Aft CG if possible, land on mains, hold the nose up, lower gently before losing elevator authority, minimum braking.","Land on the good side, hold the wing up with aileron, stay straight with rudder and steering, prepare evacuation.","Nature, Intentions, Time, Special instructions: the briefing to the senior cabin crew."]},{"code":"PL 16","title":"High-Lift Device Failures","phase":"Phase 4 — Systems failures and abnormal operations","aim":"Manage flap or slat failures on the ground, after take-off and in approach, recalculate speeds and distances, and fly a safe flapless or partial-flap approach and landing.","outcomes":["Decide after a flap/slat retraction failure","Handle an extension failure before take-off and in approach","Apply the emergency flap extension","Fly a flapless landing and go-around"],"refs":"QRH (flap/slat malfunction, flapless landing); SOP chapter 3; OM B section 1 (flap limit speeds), section 4 (landing distance factors)","sections":[{"h":"Retraction failure after take-off","blocks":[{"p":"Keep the aircraft below the flap limit speed (VFE) for the flap position. Troubleshoot with the QRH (asymmetry, jam, hydraulic or electrical cause). The flight continues with reduced maximum speed, higher fuel burn, lower climb gradient and a lower ceiling."},{"decision":{"question":"Flaps/slats will not retract: continue or return?","yesLabel":"CONTINUE","noLabel":"RETURN (QRF) or DIVERT","title":"Flap retraction failure decision","yes":["QRH allows flight in this configuration","Fuel enough at the lower speed and higher drag","Ceiling above MSA; weather and icing acceptable"],"no":["Asymmetry or structural doubt","Fuel or terrain not compatible","Weather at destination doubtful; return weather good"]}}]},{"h":"Extension failure","blocks":[{"ul":["**Before take-off:** a flap extension failure on the ground means the take-off configuration cannot be set: return to the parking stand and call maintenance (take-off configuration warning).","**In approach:** apply the QRH, recompute VREF and the landing distance with the QRH factors, and check that the runway is long enough. Consider a longer runway or a diversion."]}]},{"h":"Emergency flap extension","blocks":[{"p":"Where the aircraft has an alternate flap system, apply the emergency extension as the QRH. It is slower: start early on a long final. Coordinate tasks, fly the approach path with care, and verify the go-around procedure, the go-around gradient and any modified minima."}]},{"h":"Flapless landing","blocks":[{"img":"flapless.png","caption":"Effect of a flapless landing on speed, distance and attitude (proportions illustrative)"},{"flow":{"title":"Flapless approach and landing","steps":["**Prepare:** QRH speeds and landing distance; choose the longest runway; brief tail-strike risk.","**Approach:** longer and flatter final; stabilise early; respect bank limits at the higher speed.","**Flare:** small flare, do not hold off; touchdown at the right point.","**Braking:** maximum reverse and braking as required; anticipate a long roll.","**Go-around:** brief the flapless go-around: thrust, attitude, no flap selection unless QRH.","**Inform:** ATC (emergency services if required), PNC and PAX."]}}]}],"key":["Respect VFE for the actual flap position.","Extension failure on the ground: back to the stand.","Recompute VREF and landing distance with the QRH factors.","Flapless: higher speed, flat attitude, long roll, tail-strike risk."],"questions":["What limits your speed after a flap retraction failure?","Name four effects of flight with flaps stuck extended.","What do you do with a flap extension failure on the ground before take-off?","What must you recompute after a flap failure in approach?","Why must an emergency flap extension be started early?","What do you verify about the go-around after an emergency flap extension?","Why is the approach flatter in a flapless landing?","What is the main handling risk in the flare of a flapless landing?","How do you choose the runway for a flapless landing?","Who must be informed and what do you tell the cabin?"],"answers":["VFE for the actual flap position.","Lower maximum speed, higher fuel burn, lower climb gradient, lower ceiling.","Return to the parking stand and call maintenance.","VREF and landing distance with the QRH factors; runway suitability.","The alternate system is slower; it must be complete before final.","The procedure, the go-around gradient and any modified minima.","The higher speed and lower lift coefficient require a higher body angle relative to the path, so the path is flatter to avoid a high nose attitude.","Tail strike from excessive pitch and floating.","The longest suitable runway, with the best braking conditions and approach aids.","ATC and rescue services if needed; PNC with NITS; passengers informed of a normal-looking but faster landing."]},{"code":"PL 17","title":"Pressurisation Failure","phase":"Phase 4 — Systems failures and abnormal operations","aim":"Plan an unpressurised flight, treat a pressurisation failure on the ground or after take-off, and manage slow, rapid and explosive depressurisation with an emergency descent and diversion.","outcomes":["Plan a route, profile and fuel for unpressurised flight","Decide after a pressurisation failure at departure","Recognise hypoxia and slow depressurisation","Fly the emergency descent and diversion"],"refs":"SOP §3.8, §3.19, §3.20; OM B §10.4 (crew oxygen); OM A §8.8 (oxygen requirements); QRH","sections":[{"h":"Planned unpressurised flight","blocks":[{"p":"When the pressurisation is inoperative (MEL), the flight is planned at or below 10,000 ft cabin altitude. Choose a route where the minimum safe altitudes allow it; check weather (icing and turbulence are more frequent at low level) and the activity of restricted or military areas."},{"ul":["**Fuel:** fuel burn at low level is much higher; recompute the whole fuel plan.","**Profile:** cruise level, oxygen requirements for crew and passengers above 10,000 ft (OM A §8.8.1.1), time limits.","**Communication:** inform ATC, PNC and PAX (ear pain, no oxygen masks expected)."]}]},{"h":"Pressurisation failure on the ground or after take-off","blocks":[{"p":"On the ground before departure: analyse with maintenance, apply the MEL, and decide whether to fly unpressurised or delay. After take-off: stop the climb, level at a safe altitude (≤ 10,000 ft if possible), apply the QRH, then decide to return or continue at low level if fuel, weather and terrain allow."}]},{"h":"Slow depressurisation and hypoxia","blocks":[{"p":"A slow leak may be noticed only by the cabin altitude warning or by hypoxia symptoms. Hypoxia is insidious: the victim rarely notices it. Monitor the cabin altitude and rate, and react to the first signal."},{"table":{"head":["Altitude","Time of useful consciousness (approximate)"],"widths":[0.4,0.6],"rows":[["FL250","3 to 5 minutes"],["FL300","1 to 2 minutes"],["FL350","30 to 60 seconds"],["FL400","15 to 20 seconds"]]}},{"p":"Symptoms: euphoria, impaired judgement, slow reactions, headache, cyanosis (blue lips and nails), tunnel vision, tingling. In a rapid decompression the time of useful consciousness is roughly halved."}]},{"h":"Rapid or explosive depressurisation and emergency descent","blocks":[{"img":"descent.png","caption":"Rapid depressurisation and emergency descent profile"},{"flow":{"title":"Emergency descent: crew actions","steps":["**Masks on, 100%,** establish crew communication (\"mask on\" check).","**Memory items:** pressurisation check; if cabin altitude cannot be controlled, start the emergency descent at once (SOP §3.8).","**Descend:** heading change as appropriate, maximum safe speed (MMO/VMO or lower if damage), speed brakes as SOP.","**MAYDAY,** squawk 7700, advise ATC of the descent and the level.","**Cabin:** passenger signs and PA; senior cabin crew reports after level-off.","**Level off** at 10,000 ft or MSA if higher; check terrain all the time.","**Diversion:** position, route to the nearest suitable aerodrome, fuel at low level."]}},{"warn":"Structural damage may limit the speed: if damage is suspected, descend at the current speed or lower. MSA is the priority over 10,000 ft over mountainous terrain."}]}],"key":["Plan unpressurised flights at or below 10,000 ft cabin altitude, with fuel for low level.","Hypoxia is insidious: react to the first signal.","Masks first, then communicate, then descend.","MAYDAY and squawk 7700; level at 10,000 ft or MSA.","Recompute fuel at low level for the diversion."],"questions":["What must be considered when planning an unpressurised flight?","What are the crew oxygen requirements in OM A §8.8.1.1?","What do you do after a pressurisation failure just after take-off?","Why is slow depressurisation dangerous?","Give five symptoms of hypoxia.","What is the approximate time of useful consciousness at FL350?","What are the first three actions of a rapid depressurisation?","At what speed do you fly the emergency descent, and when do you reduce it?","To what altitude do you descend, and what can change it?","What do you check after level-off?"],"answers":["Route and MSA, weather (icing/turbulence), restricted areas, higher fuel burn, oxygen and information to ATC/PNC/PAX.","Continuous use above 10,000 ft cabin altitude for more than 30 minutes, and always above 13,000 ft.","Stop the climb, level at a safe altitude, apply the QRH, decide to return or continue at low level.","It may go unnoticed and hypoxia impairs judgement without the victim realising it.","Euphoria, impaired judgement, slow reactions, headache, cyanosis, tunnel vision, tingling.","About 30 to 60 seconds (less in a rapid decompression).","Masks on 100%, establish communication, start the emergency descent.","Maximum safe speed (up to MMO/VMO); lower if structural damage is suspected.","10,000 ft, or MSA if higher.","Passengers and cabin crew condition, oxygen, fuel at low level, diversion route and terrain."]},{"code":"PL 13","title":"Acceleration-Stop and Evacuation","phase":"Phase 5 — Severe emergencies, security and rescue","aim":"Decide and execute a rejected take-off, then decide whether to evacuate, and lead the evacuation with clear orders and full authority.","outcomes":["Relate VEF and V1 to the stop or go decision","Recognise the causes that justify a rejected take-off","Execute the RTO and the post-stop assessment","Order and coordinate an evacuation"],"refs":"SOP §2.3, §3.1, §3.3, §3.4, §3.5 and chapter 4 (evacuation commands); OM B section 11 (evacuation); QRH","sections":[{"h":"Acceleration-stop: speeds and causes","blocks":[{"p":"**VEF** is the speed at which the engine failure is assumed; **V1** is the speed by which the decision to stop must have been taken and the first stopping action applied. Stopping after V1 is likely to overrun the runway; continuing before VEF may not give the required climb or control."},{"table":{"head":["Possible cause","Typical decision"],"widths":[0.45,0.55],"rows":[["Engine failure or flameout","Below V1: stop. At or above V1: continue."],["Fire or fire warning","Below V1: stop."],["Predictive windshear warning","Below V1: stop."],["Tyre burst","Low speed: stop. High speed: usually continue unless severe vibration or loss of control (brief the SOP)."],["Structural damage / bird strike","Stop if the aircraft is unsafe or unable to fly."],["Runway incursion","Stop if a collision risk exists."]]}}]},{"h":"Executing the rejected take-off","blocks":[{"flow":{"title":"Rejected take-off: decision to assessment","steps":["**Decide:** the captain calls \"ABORT\".","**Stop:** power levers idle, maximum braking (or autobrake RTO), reverse as required; keep the centre line.","**Coordinate:** PM monitors deceleration, calls speeds and reverse, informs ATC (\"stopping\").","**Assess (bilan):** fire? damage? hot brakes? Is evacuation needed?","**Inform:** PA \"Attention crew at stations\" to hold the cabin; then ATC, PNC and passengers.","**Checklist:** RTO/QRH; brake cooling; maintenance."]}}]},{"h":"Evacuation: when","blocks":[{"p":"An evacuation is decided when staying on board is more dangerous than leaving: uncontrolled fire on the ground, smoke in the cabin, serious structural damage, after a forced landing or ditching, or a severe RTO with fire. A precautionary disembarkation (stairs) is preferred when time allows, as evacuations cause injuries."},{"decision":{"question":"After the stop: evacuate?","yesLabel":"EVACUATE","noLabel":"REMAIN ON BOARD","title":"Evacuation decision","yes":["Uncontrolled fire or fire warning that does not extinguish","Smoke or fumes in the cabin","Major structural damage or fuel leak with fire risk"],"no":["Fire extinguished and no hazard","Hot brakes only: keep passengers on board, call fire services","Normal disembarkation possible"]}}]},{"h":"Evacuation: how","blocks":[{"ol":["Parking brake set; engines shut down; fire handles as required; inform ATC and fire services.","Evacuation checklist (SOP chapter 4): pressurisation, flaps, fuel, batteries as listed.","Command: \"EVACUATE, EVACUATE, EVACUATE\" on PA, with the side to use if one side is unsafe.","Cabin crew open usable exits, deploy slides and direct passengers away from the aircraft.","Flight crew take the required equipment, check the cabin if possible, and leave last; account for everyone at the assembly point."]},{"warn":"The captain’s authority is absolute during an evacuation. Orders must be short, loud and unambiguous. Leave the bags; keep passengers away from engines and the fire."}]}],"key":["V1 is the last moment to start stopping.","The captain calls ABORT and EVACUATE.","After the stop: hold the cabin, assess, then decide.","Evacuate when staying is more dangerous than leaving."],"questions":["Define VEF and V1.","Why is stopping after V1 dangerous?","Name five causes that justify a rejected take-off below V1.","What are the stopping actions of an RTO?","What does the PM do during the RTO?","What PA is made immediately after the stop, and why?","When do you decide to evacuate?","When is a precautionary disembarkation preferred?","What are the evacuation command words?","What are the duties of the flight crew after the evacuation command?"],"answers":["VEF: speed of the assumed engine failure. V1: the speed by which the stop decision and first action must be taken.","The accelerate-stop distance may exceed the runway available.","Engine failure, fire/fire warning, predictive windshear, unsafe aircraft/structural damage, runway incursion (and below 80 kt any warning or caution).","Power levers idle, maximum braking or autobrake RTO, reverse as required, centre line.","Monitors deceleration, calls speeds/reverse, informs ATC.","\"Attention crew at stations\": holds the cabin crew ready while the flight crew assesses.","When remaining on board is more dangerous: uncontrolled fire, smoke, major damage, after a forced landing or ditching.","When there is no immediate danger, to avoid injuries.","\"EVACUATE, EVACUATE, EVACUATE\" with the side to use if needed.","Complete the checklist, take equipment, check the cabin if possible, leave last, account for everyone."]},{"code":"PL 14","title":"Fire Management","phase":"Phase 5 — Severe emergencies, security and rescue","aim":"Manage engine, cabin and landing gear fires with immediate procedures, tight crew coordination and correct distress communication, and decide on descent, landing or evacuation.","outcomes":["Apply engine fire procedures, controlled and uncontrolled","Coordinate flight crew and cabin crew on a cabin fire","Manage a landing gear or brake fire","Use safety, urgency and distress radio messages correctly"],"refs":"QRH (engine fire, smoke and fumes, cargo fire, wheel well fire); SOP chapter 3; OM B section 10 (fire extinguishers, PBE); Safety and Rescue Manual","sections":[{"h":"Emergency protocol","blocks":[{"p":"Any fire on board is an **emergency**. Declare MAYDAY, request the nearest suitable aerodrome, and plan to land as soon as possible. A cabin fire can become uncontrollable within minutes; a fire that is \"out\" may restart."},{"table":{"head":["Message","Prefix","Use"],"widths":[0.2,0.3,0.5],"rows":[["Distress","MAYDAY MAYDAY MAYDAY","Grave and imminent danger, immediate assistance required (fire, severe damage)."],["Urgency","PAN PAN, PAN PAN, PAN PAN","Urgent situation, no immediate assistance (e.g. sick passenger, minor failure)."],["Safety","SÉCURITÉ (×3)","Safety information (e.g. weather or navigation warning)."]]}}]},{"h":"Engine fire","blocks":[{"flow":{"title":"Engine fire in flight","steps":["**Fly:** PF keeps control; above 400 ft (unless SOP differs).","**Identify:** fire warning and engine confirmed by both pilots.","**Memory items:** power lever idle, condition/fuel lever off, fire handle pulled, first agent discharged (as QRH).","**Timer:** if the warning persists after the QRH time, discharge the second agent.","**Uncontrolled:** fire persists after both agents: land immediately at the nearest suitable aerodrome; prepare evacuation.","**Inform:** MAYDAY, PNC (NITS), passengers; fire services on landing."]}}]},{"h":"Cabin fire and smoke","blocks":[{"p":"The cabin crew fight the fire (find the source, extinguisher, PBE, report); the flight crew don oxygen masks and goggles, apply the smoke/fumes QRH, start the descent and diversion, and receive regular reports. The **captain’s PA** keeps passengers calm and gives instructions (heads down, breathe through cloth)."},{"table":{"head":["Flight crew (PNT)","Cabin crew (PNC)"],"widths":[0.5,0.5],"firstBold":false,"rows":[["Masks and goggles, 100%, communication","Locate the source; alert the flight deck"],["Smoke/fumes QRH; isolate the source if possible","Fight the fire: extinguisher, PBE, team roles"],["MAYDAY; descend; nearest suitable aerodrome","Move passengers away; wet cloths; report every 2–3 min"],["Prepare landing and possible evacuation","Prepare cabin for landing and evacuation"]]}},{"warn":"If the fire is not confirmed out and under control, land immediately: do not wait for a better aerodrome. Toilet and oven fires are common: check them first."}]},{"h":"Landing gear and brake fire","blocks":[{"p":"A wheel well or brake fire may follow a rejected take-off or heavy braking. In flight: apply the QRH (often gear down to cool and extinguish, within the speed limits). On the ground: stop, inform ATC and fire services, keep passengers on board away from the wheels unless fire spreads, then evacuate on the side away from the fire if needed."}]},{"h":"Crucial reminders","blocks":[{"ul":["Know the location and use of every extinguisher (Halon for cabin and electrical fires, water for paper/fabric), the PBE and the crash axe (PL 19).","Strict task sharing: one pilot flies, one manages the fire procedure and communication.","Report, record and inspect: a fire event is reported in the technical log and the company reporting system."]}]}],"key":["Fire is an emergency: MAYDAY.","Engine fire: identify, memory items, second agent if needed.","Cabin fire: masks, descend, divert, land as soon as possible.","Not confirmed out: land immediately."],"questions":["Why is any fire on board treated as an emergency?","Give the radio prefixes for distress, urgency and safety messages.","What are the memory items for an engine fire in flight?","When do you discharge the second fire agent?","What do you do if an engine fire remains uncontrolled?","What are the first actions of the flight crew for cabin smoke?","What are the cabin crew tasks during a cabin fire?","What is the content of the captain’s PA during a cabin fire?","What do you do with a brake fire after landing?","Which extinguisher is used for an electrical fire?"],"answers":["It can become uncontrollable within minutes and threatens the whole aircraft.","MAYDAY ×3, PAN PAN ×3, SÉCURITÉ ×3.","Power lever idle, condition/fuel lever off, fire handle pulled, agent discharged, as per QRH.","If the fire warning persists after the time stated in the QRH.","Land immediately at the nearest suitable aerodrome and prepare for evacuation.","Masks and goggles at 100%, communication, smoke/fumes QRH, MAYDAY, descend and divert.","Locate the source, fight the fire with extinguishers and PBE, move passengers, report to the flight deck regularly.","Calm information, instructions (stay seated, heads down, breathe through cloth), intention to land.","Stop, inform ATC and fire services, keep passengers on board unless fire spreads, evacuate away from the fire.","Halon (BCF)."]},{"code":"PL 18","title":"Forced Landing and Ditching","phase":"Phase 5 — Severe emergencies, security and rescue","aim":"Think ahead about the situations that impose a forced landing or ditching, choose the landing area, configure the aircraft and the cabin, and lead the crew through impact, evacuation and survival.","outcomes":["Identify the situations that may force a landing off-aerodrome","Plan the glide, choose terrain and heading","Configure aircraft and cabin and give the brace calls","Lead post-impact evacuation and survival"],"refs":"QRH (forced landing, ditching, all engines failure); SOP chapters 3 and 4; OM B §10.6 (ditching equipment), section 11; Safety and Rescue Manual","sections":[{"h":"Prior reflection","blocks":[{"p":"A forced landing or ditching follows a catastrophic event: failure of all engines (fuel starvation, volcanic ash, contaminated fuel), uncontrollable fire, or major structural damage. The captain prepares for it during flight preparation: terrain along the route, sea crossings, emergency fields, and the equipment on board."}]},{"h":"Forced landing","blocks":[{"flow":{"title":"Forced landing sequence","steps":["**Glide:** best glide speed; estimate the distance available (height × glide ratio).","**Choose:** civil or military emergency field first; else a clear field, into wind, clear of obstacles, considering sun and visibility.","**MAYDAY:** position, intention, persons on board; squawk 7700.","**Cabin:** NITS to the senior cabin crew; passengers briefed; brace position; exits assigned.","**Configure:** gear and flaps as QRH (gear down on a prepared field, as QRH off-field); speed; fuel and electrics off before impact as QRH.","**Impact:** \"BRACE, BRACE\" at the time in the QRH (e.g. about 500 ft); minimum speed, wings level.","**After:** evacuation order, rescue organisation, account for all occupants."]}}]},{"h":"Ditching","blocks":[{"img":"ditching.png","caption":"Choosing the ditching heading relative to the swell and wind"},{"ul":["**Approach:** MAYDAY with position; ATC/rescue coordination; life jackets on (not inflated inside the cabin).","**Sea state:** land parallel to the primary swell, on the crest or the back of a swell; with strong wind, compromise towards a headwind.","**Configuration:** gear up, flaps as QRH, minimum safe speed, nose-up attitude as QRH; ditching switch if fitted.","**Impact:** brace call; expect more than one impact.","**After:** evacuate through exits above the waterline; life rafts and slides; ELT activated; keep the group together."]}]},{"h":"Post-impact duties and leadership","blocks":[{"p":"The captain keeps the crew calm and efficient: clear orders, simple tasks, and constant information. After evacuation: first aid, shelter, signalling (ELT, flares, mirror), headcount, and staying with the aircraft unless danger forces otherwise. The calm of the captain becomes the calm of the crew."}]}],"key":["Think about forced landing and ditching during preparation.","Best glide, choose the site early, MAYDAY.","Ditch parallel to the swell, gear up.","Brace call at the right time; lead the evacuation and survival."],"questions":["List three events that may force a landing off-aerodrome.","How do you estimate the distance available in a glide?","What are your criteria for choosing a forced landing field?","What information does the MAYDAY message contain?","What is the content of the NITS briefing?","When and how is the brace call given?","What heading do you choose for ditching relative to the swell?","What is the gear position for ditching?","Why must life jackets not be inflated inside the cabin?","What are the survival priorities after evacuation?"],"answers":["All engines failure (fuel starvation, ash), uncontrollable fire, major structural damage.","Height × glide ratio (using the QRH best glide data).","Emergency field first, else a clear, long field into wind, clear of obstacles, sun and visibility considered.","Callsign, nature of emergency, intentions, position, level, persons on board.","Nature of the emergency, Intentions, Time available, Special instructions.","\"BRACE, BRACE\" on PA at the time given in the QRH, shortly before impact.","Parallel to the primary swell, on the crest or back; compromise towards headwind if wind is strong.","Gear up.","Inflated jackets can trap passengers when the cabin floods.","First aid, shelter, signalling (ELT, flares), headcount, stay together near the aircraft."]},{"code":"PL 19","title":"Safety and Rescue Equipment","phase":"Phase 5 — Severe emergencies, security and rescue","aim":"Know the regulations, location, checks and use of all safety and rescue equipment, and coordinate the crew during emergencies and special procedures.","outcomes":["State the equipment required for high altitude, sea and desert flights","Locate and operate doors, exits and all emergency equipment","Perform pre-flight and in-flight checks with the cabin crew","Apply the coordination for emergencies and special procedures"],"refs":"OM B section 10 (emergency equipment, oxygen), section 11 (evacuation); OM D §1.3; OM A Section 10; Safety and Rescue Manual; aircraft certificate of airworthiness","sections":[{"h":"Regulations and provisioning","blocks":[{"table":{"head":["Flight environment","Additional equipment required"],"widths":[0.3,0.7],"rows":[["High altitude","Crew and passenger oxygen in quantities set by OM A §8.8; PBE for crew."],["Overwater (maritime overflight)","Life jackets for all occupants; life rafts when beyond the distance from land set by the regulations; survival ELT."],["Inhospitable areas (desert)","Survival equipment for the area (water, signalling, first aid); ELT."]]}}]},{"h":"Doors and exits","blocks":[{"p":"Know the classification of every door and exit (type, size, slide or no slide), the operation in normal and emergency mode, the lighting (emergency lights and floor path marking), and the procedure when an exit is unavailable (MEL: seat restrictions, passenger number reduced)."}]},{"h":"Equipment inventory and use","blocks":[{"table":{"head":["Equipment","Use and key points"],"widths":[0.27,0.73],"rows":[["Oxygen","Crew masks (quick-donning, 100% and emergency pressure), passenger masks, portable bottles for first aid; check the crew system pressure at preflight (OM B §10.4)."],["Fire extinguishers","Halon for cabin, electrical and fuel fires; water for paper and fabric; know the location of each one."],["PBE / smoke goggles / gloves","Protection for the crew fighting fire and smoke."],["Crash axe and megaphone","Access behind panels; command in evacuation."],["ELT","Automatic on impact (fixed) and portable/survival units; 121.5 / 406 MHz."],["Life jackets and rafts","Under seats; inflate outside the aircraft; rafts and slide-rafts as fitted."],["First aid kit and doctor’s kit","First aid by crew; doctor’s kit for a qualified person (with captain approval and report)."],["Emergency lighting and slides","Self-powered lighting; slides armed before taxi, disarmed at the gate."]]}},{"p":"**Arming plan:** the crew must know the location of every item without looking for it. Walk the cabin during line training and test yourself on the plan."}]},{"h":"Normal and emergency coordination","blocks":[{"p":"Before flight: equipment checks by flight and cabin crew, briefing on special items (exit unavailable, special passengers). In flight: periodic contact with the cabin (every 30 minutes, 15 at night)."},{"table":{"head":["Event","Coordination required"],"widths":[0.35,0.65],"rows":[["Cabin, toilet or oven fire; smoke","PNC fight and report; PNT masks, QRH, descend and divert (PL 14)."],["Acceleration-stop and evacuation","\"Attention crew at stations\", then evacuate or stand down (PL 13)."],["Forced landing / ditching","NITS, cabin preparation, brace call, evacuation (PL 18)."],["Depressurisation / emergency descent","Masks, descent, PNC check after level-off (PL 17)."]]}}]},{"h":"Special procedures","blocks":[{"ul":["**Refuelling with passengers on board,** embarking or disembarking: cabin crew at doors, exits clear, signs on, communication with the refueller, ready to evacuate.","**Pilot incapacitation:** take control, call the cabin crew to secure the incapacitated pilot, declare an emergency, land at the nearest suitable aerodrome (SOP §3.18).","**Unexpected oxygen mask drop:** check cabin altitude; if normal, reassure passengers and inform maintenance.","**Stretcher passenger:** seat removal, position, medical escort, oxygen, and captain’s acceptance."]}]}],"key":["Know the equipment required for altitude, sea and desert flights.","Know every item location from the arming plan.","Check crew oxygen pressure at every preflight.","Coordinate PNT and PNC with standard words and NITS."],"questions":["What additional equipment is required for overwater flights?","What equipment is needed for flights over inhospitable areas?","Where do you check the crew oxygen minimum pressure?","Which extinguisher do you use for a paper fire, and which for an electrical fire?","What are the frequencies of the ELT?","When are life jackets inflated?","What is the arming plan and why must you know it by heart?","What are the conditions for refuelling with passengers on board?","What are the actions after a pilot incapacitation?","What do you do after an unexpected oxygen mask drop?"],"answers":["Life jackets for all, life rafts beyond the distance from land in the regulations, survival ELT.","Survival equipment for the area (water, signalling, first aid) and an ELT.","At preflight, against the minimum dispatch pressure in OM B §10.4.","Water for paper; Halon for electrical.","121.5 MHz and 406 MHz.","Outside the aircraft, after leaving the cabin.","The plan showing the location of all safety equipment; in an emergency there is no time to search.","Cabin crew at doors, exits clear, signs on, communication with the refueller, ready to evacuate.","Take control, secure the pilot with cabin crew help, declare an emergency, land at the nearest suitable aerodrome.","Check cabin altitude; if normal, reassure passengers and inform maintenance."]},{"code":"PL 20","title":"Special Flights","phase":"Phase 5 — Severe emergencies, security and rescue","aim":"Prepare and operate flights with VIPs, dangerous goods or special security needs, and apply company instructions for unlawful interference and hijacking.","outcomes":["Prepare a VIP flight with crew, ATC and security","Check dangerous goods documents, loading and the NOTOC","Apply airport and on-board security rules","Act correctly during unlawful interference and hijacking"],"refs":"OM A Section 9 (dangerous goods), Section 10 (security), §8.1.10 (NOTOC); OM A §10.1.3.1.1 (flight deck door); SOP §2.2 (passwords); PSE; security note DQSS N°211","sections":[{"h":"Definition","blocks":[{"p":"Special flights are flights where the passengers or the freight carried require specific handling or special regulations: VIP flights, dangerous goods, medical flights, or flights under particular security measures."}]},{"h":"VIP flights","blocks":[{"ul":["**Preparation:** aircraft and crew selected and briefed early; flight plan and ATC/State notifications; slot and protocol times.","**Passengers:** specific treatment and service, but the same safety rules (seat belts, briefing, baggage).","**Security personnel on board:** carriage of weapons only as authorised (OM A Sections 9 and 10); the captain is informed of armed persons and their seats."]}]},{"h":"Dangerous goods","blocks":[{"table":{"head":["Class","Examples"],"widths":[0.2,0.8],"rows":[["1","Explosives"],["2","Gases (flammable, non-flammable, toxic)"],["3","Flammable liquids"],["4","Flammable solids"],["5","Oxidisers and organic peroxides"],["6","Toxic and infectious substances"],["7","Radioactive material"],["8","Corrosives"],["9","Miscellaneous (e.g. lithium batteries, dry ice)"]]}},{"p":"Reference documents: ICAO Technical Instructions and the IATA DGR, plus OM A Section 9. Check packaging and labels, incompatibilities (segregation), loading and securing. The captain receives the **NOTOC** (class, UN number, quantity, hold position) before departure and keeps a copy on board."},{"warn":"In an in-flight incident with dangerous goods: apply the QRH/emergency response drill, inform ATC of the goods carried (from the NOTOC), and report after landing. Reject any package that is damaged or leaking."}]},{"h":"Aviation security","blocks":[{"ul":["**Airport zone:** respect access control and badges; coordinate with the border police (Police de l’air et des frontières) for control of passengers, baggage and freight.","**On board:** control access to the aircraft; flight deck door closed during boarding, locked from main door closure to arrival (OM A §10.1.3.1.1); CCTV identification; cockpit and unlawful-interference passwords each day (SOP §2.2).","**Bomb threat (DQSS N°211):** pre-flight security check; report any suspect item before boarding; do not touch it; follow the PSE chapters 5.8 (ground) and 14.2.2 (in flight)."]}]},{"h":"Unlawful interference and hijacking","blocks":[{"flow":{"title":"Unlawful interference: captain’s priorities","steps":["**Keep the flight deck door locked;** never open it under threat.","**Inform ATC discreetly:** squawk 7500; use the agreed phrases.","**Land as soon as possible** at a suitable aerodrome if safety requires; follow ATC and State instructions.","**Cabin:** apply company instructions with the cabin crew; use the unlawful-interference password.","**After:** follow the authorities’ instructions; report const PASS = 8;
const B = COURSE.briefings;
const KEY = 'dal-cutb-progress-v1';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const slug = (code) => code.toLowerCase().replace(/\s+/g, '-');

// ---------- State (device copy always; shared copy when the viewer may write) ----------
let state = { name: '', started: null, briefings: {}, completed: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {}
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
let db = null, me = null, userApi = null, sharedOk = false, isInstructor = false, syncNote = 'Your progress is saved on this device.';

async function initShared() {
  try {
    userApi = await claude.use('user');
    db = await claude.use('db');
    if (!userApi || !db) return;
    isInstructor = (await userApi.canEdit()) || (await userApi.isOwner());
    if (isInstructor) render();
    me = await userApi.id();
    if (!me) return;
    const snap = await Promise.race([db.doc('progress/' + me).get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]);
    const remote = snap && snap.exists ? snap.data() : null;
    if (remote) merge(remote);
    sharedOk = true; syncNote = 'Your progress is saved to your Domestic Airlines training record.';
    render();
  } catch (e) { /* keep device copy */ }
}
function merge(r) {
  if (!state.name && r.name) state.name = r.name;
  if (!state.started && r.started) state.started = r.started;
  for (const [k, v] of Object.entries(r.briefings || {})) {
    const l = state.briefings[k];
    if (!l || (v.passed && !l.passed) || (v.best || 0) > (l.best || 0)) state.briefings[k] = v;
  }
  if (!state.completed && r.completed) state.completed = r.completed;
  saveLocal();
}
let pushing = false;
async function pushShared() {
  saveLocal();
  if (!sharedOk || pushing) return;
  pushing = true;
  try { await db.doc('progress/' + me).set({ name: state.name, started: state.started, completed: state.completed, briefings: state.briefings, updated: new Date().toISOString(), passedCount: passedCount() }); }
  catch (e) { sharedOk = false; syncNote = 'Your progress is saved on this device (your access does not allow saving to the training record).'; }
  pushing = false;
}

// ---------- Progress logic ----------
const passed = (code) => !!(state.briefings[code] && state.briefings[code].passed);
const passedCount = () => B.filter((b) => passed(b.code)).length;
const unlocked = (i) => i === 0 || passed(B[i - 1].code);
const firstOpen = () => { const i = B.findIndex((b) => !passed(b.code)); return i < 0 ? null : i; };

// ---------- Rendering ----------
const view = document.getElementById('view');
const mapEl = document.getElementById('map');
function renderMap(current) {
  let html = `<a href="#home" class="${current === 'home' ? 'current' : ''}"><span class="dot open">⌂</span><span>Start here</span></a>`;
  let phase = '';
  B.forEach((b, i) => {
    if (b.phase !== phase) { phase = b.phase; html += `<h3>${esc(phase.replace(/\s*—.*/, ''))} · ${esc(phase.replace(/^.*?—\s*/, ''))}</h3>`; }
    const done = passed(b.code), open = unlocked(i);
    html += `<a href="#${slug(b.code)}" class="${current === b.code ? 'current' : ''} ${open ? '' : 'locked'}" ${open ? '' : 'aria-disabled="true"'}>
      <span class="dot ${done ? 'done' : open ? 'open' : ''}">${done ? '✓' : open ? b.code.slice(3) : '•'}</span><span>${esc(b.code)} — ${esc(b.title)}</span></a>`;
  });
  html += `<h3>Completion</h3><a href="#certificate" class="${current === 'certificate' ? 'current' : ''} ${state.completed ? '' : 'locked'}"><span class="dot ${state.completed ? 'done' : ''}">★</span><span>Course certificate</span></a>`;
  if (isInstructor) html += `<h3>Instructor</h3><a href="#results" class="${current === 'results' ? 'current' : ''}"><span class="dot open">≡</span><span>Candidate results</span></a>`;
  mapEl.innerHTML = html;
  const n = passedCount();
  document.getElementById('overallBar').style.width = (n / B.length * 100) + '%';
  document.getElementById('overallTxt').textContent = `${n} / ${B.length}`;
}
function block(b) {
  if (b.p) return `<p>${md(b.p)}</p>`;
  if (b.ul) return `<ul class="b">${b.ul.map((t) => `<li>${md(t)}</li>`).join('')}</ul>`;
  if (b.ol) return `<ol class="o">${b.ol.map((t) => `<li>${md(t)}</li>`).join('')}</ol>`;
  if (b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map((h) => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i === 0 && b.table.firstBold !== false ? 'first' : ''}">${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if (b.img) return `<figure><div class="img"><img src="img/${esc(b.img)}" alt="${esc(b.caption)}" loading="lazy"></div><figcaption>${esc(b.caption)}</figcaption></figure>`;
  if (b.flow) return `<div class="flow" role="list" aria-label="${esc(b.flow.title)}"><div class="t">${esc(b.flow.title)}</div>${b.flow.steps.map((s, i) => `${i ? '<div class="arrow" aria-hidden="true">▼</div>' : ''}<div class="step" role="listitem"><div class="num">${i + 1}</div><div class="body">${md(s)}</div></div>`).join('')}</div>`;
  if (b.decision) { const d = b.decision; return `<div class="decision"><div class="q">${esc(d.question)}</div><div class="cols"><div class="col yes"><b>▼ ${esc(d.yesLabel || 'YES')}</b><ul>${d.yes.map((t) => `<li>${md(t)}</li>`).join('')}</ul></div><div class="col no"><b>▼ ${esc(d.noLabel || 'NO')}</b><ul>${d.no.map((t) => `<li>${md(t)}</li>`).join('')}</ul></div></div></div>`; }
  if (b.box) return `<div class="callout ${b.box.tone === 'red' ? 'red' : ''}"><div class="h">${esc(b.box.title)}</div><ul>${b.box.items.map((t) => `<li>${md(t)}</li>`).join('')}</ul></div>`;
  if (b.warn) return `<div class="callout red"><div class="h">Captain’s warning</div><p>${md(b.warn)}</p></div>`;
  return '';
}

  const n = passedCount(), next = firstOpen();
  const intro = COURSE.intro.map((s) => `<section class="sec"><h2>${esc(s.h)}</h2>${s.blocks.map(block).join('')}</section>`).join('');

function renderBriefing(i) {
  const b = B[i];
  if (!unlocked(i)) {
    const need = B[i - 1];
    view.innerHTML = `<div class="callout red"><div class="h">Briefing locked</div><p>Pass the knowledge check of ${esc(need.code)} — ${esc(need.title)} with at least ${PASS}/10 to open ${esc(b.code)}.</p><div class="row"><a class="btn" href="#${slug(need.code)}">Go to ${esc(need.code)}</a></div></div>`;
    return;
  }
  if (!state.started) { state.started = new Date().toISOString(); saveLocal(); }
  const ph = (b.phase.match(/Phase\s+(\d+)/i) || [0, ''])[1];
  const rec = state.briefings[b.code];
  view.innerHTML = `
    <div class="banner"><div class="phase"><small>PHASE</small><b>${ph}</b></div><div class="txt"><div class="eyebrow">${esc(b.phase.replace(/^Phase\s+\d+\s*—\s*/i, ''))}</div><h1>${esc(b.code)} — ${esc(b.title)}</h1>
      ${rec ? `<div><span class="pill ${rec.passed ? 'ok' : 'ko'}">${rec.passed ? 'Passed' : 'Not yet passed'} · best ${rec.best}/10</span></div>` : ''}</div></div>
    <div class="facts"><div class="k">Aim</div><div>${md(b.aim)}</div><div class="k">Learning outcomes</div><div><ul>${b.outcomes.map((o) => `<li>${md(o)}</li>`).join('')}</ul></div><div class="k">Company references</div><div>${md(b.refs)}</div></div>
    ${b.sections.map((s, k) => `<section class="sec"><h2><span class="n mono">${String(k + 1).padStart(2, '0')}</span>${esc(s.h)}</h2>${s.blocks.map(block).join('')}</section>`).join('')}
    <div class="callout"><div class="h">Captain’s key points</div><ul>${b.key.map((t) => `<li>${md(t)}</li>`).join('')}</ul></div>

      ${i < B.length - 1 ? `<a class="btn ${passed(b.code) ? '' : 'ghost'}" href="#${slug(B[i + 1].code)}" ${passed(b.code) ? '' : 'aria-disabled="true"'}>${esc(B[i + 1].code)} →</a>` : ''}</div>`;

// ---------- Knowledge check: answer, reveal the model answer, self-assess, move forward ----------
const quizState = {};
function quiz(i) {
  const b = B[i], el = document.getElementById('quiz');
  const q = quizState[b.code] || (quizState[b.code] = { idx: 0, marks: [], answers: [], revealed: false, started: false });
  const dots = () => `<div class="qdots" aria-hidden="true">${b.questions.map((_, k) => `<span class="${q.marks[k] === true ? 'ok' : q.marks[k] === false ? 'ko' : ''} ${k === q.idx && q.started && q.idx < 10 ? 'cur' : ''}"></span>`).join('')}</div>`;
  const head = `<div class="quiz-head"><h2>Knowledge check — ${esc(b.code)}</h2>${dots()}</div>`;
  if (!q.started) {
    const rec = state.briefings[b.code];
    el.innerHTML = `${head}<div class="quiz-body"><p>Ten questions. Write your answer, show the model answer, and assess yourself honestly. You need <b>${PASS} correct</b> to pass and unlock the next briefing.</p>
      ${rec ? `<p class="hint">Attempts so far: ${rec.attempts}. Best score: ${rec.best}/10.</p>` : ''}<div class="row"><button class="btn" id="qStart">${rec ? 'Take the check again' : 'Start the knowledge check'}</button></div></div>`;
    el.querySelector('#qStart').onclick = () => { Object.assign(q, { started: true, idx: 0, marks: [], answers: [], revealed: false }); quiz(i); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    return;
  }
  if (q.idx >= b.questions.length) {
    const score = q.marks.filter(Boolean).length, ok = score >= PASS;
    const prev = state.briefings[b.code] || { attempts: 0, best: 0, passed: false };
    if (!q.recorded) {
      q.recorded = true;
      state.briefings[b.code] = { attempts: prev.attempts + 1, best: Math.max(prev.best, score), last: score, passed: prev.passed || ok, date: new Date().toISOString().slice(0, 10) };
      if (passedCount() === B.length && !state.completed) state.completed = new Date().toISOString().slice(0, 10);
      pushShared(); renderMap(b.code);
    }
    const next = i < B.length - 1 ? B[i + 1] : null;
    el.innerHTML = `${head}<div class="quiz-body"><div class="result"><div class="score mono ${ok ? '' : 'fail'}">${score}/10</div>
      <p><b>${ok ? 'Briefing passed.' : 'Not passed yet.'}</b> ${ok ? (next ? `${esc(next.code)} is now open.` : 'You have completed the last briefing.') : `Review the sections linked to the questions you missed, then take the check again (${PASS}/10 needed).`}</p>
      <div class="row">${ok ? (next ? `<a class="btn" href="#${slug(next.code)}">Continue to ${esc(next.code)} →</a>` : (state.completed ? `<a class="btn" href="#certificate">View your certificate →</a>` : '')) : `<button class="btn red" id="qRetry">Take the check again</button>`}
      <button class="btn ghost" id="qReview">Review my answers</button></div></div><div id="qRev"></div></div>`;
    const retry = el.querySelector('#qRetry'); if (retry) retry.onclick = () => { q.started = false; q.recorded = false; quiz(i); };
    el.querySelector('#qReview').onclick = () => { el.querySelector('#qRev').innerHTML = b.questions.map((t, k) => `<div class="model" style="margin-top:10px"><div class="h">Q${k + 1} · <span class="pill ${q.marks[k] ? 'ok' : 'ko'}">${q.marks[k] ? 'Correct' : 'Missed'}</span></div><p><b>${md(t)}</b></p><p class="hint">Your answer: ${esc(q.answers[k] || '(blank)')}</p><p>${md(b.answers[k])}</p></div>`).join(''); };
    return;
  }
  const k = q.idx;
  el.innerHTML = `${head}<div class="quiz-body">
    <div class="qnum">QUESTION ${k + 1} OF ${b.questions.length}</div>
    <div class="qtext">${md(b.questions[k])}</div>
    <label for="qAns" class="hint">Your answer</label>
    <textarea id="qAns" placeholder="Answer as you would to the line training captain">${esc(q.answers[k] || '')}</textarea>
    ${q.revealed ? `<div class="model"><div class="h">Model answer</div><p>${md(b.answers[k])}</p></div>
      <p class="hint">Compare with your answer. Did you give the key points?</p>
      <div class="row"><button class="btn" id="qYes">✓ I had it right</button><button class="btn red" id="qNo">✗ I missed it</button></div>`
    : `<div class="row"><button class="btn" id="qShow">Show the model answer</button></div>`}</div>`;
  const ta = el.querySelector('#qAns'); ta.oninput = () => { q.answers[k] = ta.value; };
  if (!q.revealed) { el.querySelector('#qShow').onclick = () => { q.answers[k] = ta.value; q.revealed = true; quiz(i); }; ta.focus({ preventScroll: true }); }
  else { const mark = (v) => { q.marks[k] = v; q.idx++; q.revealed = false; quiz(i); }; el.querySelector('#qYes').onclick = () => mark(true); el.querySelector('#qNo').onclick = () => mark(false); }
}

  const total = B.reduce((a, b) => a + (state.briefings[b.code]?.best || 0), 0);
  view.innerHTML = `<div class="cert"><img src="img/logo.png" alt="Domestic Airlines" style="height:56px;width:auto;background:#fff;border-radius:4px;padding:3px 6px">
    <div class="eyebrow">Flight Operations and Training</div><h1 style="color:var(--green-ink)">Command Upgrade Training Briefing</h1>

async function renderResults() {

    if (!rows.length) { view.innerHTML = `<section class="sec"><h2>Candidate results</h2><p>No candidate has saved progress yet. Results appear here as soon as a candidate with Contributor access passes a knowledge check.</p></section>`; return; }
    rows.sort((a, b) => (b.passedCount || 0) - (a.passedCount || 0));
    view.innerHTML = `<section class="sec"><h2>Candidate results</h2><p class="hint">${rows.length} candidate${rows.length > 1 ? 's' : ''}. Best score per briefing; red means not yet passed.</p>
      <div class="tbl"><table><thead><tr><th>Candidate</th><th>Passed</th><th>Completed</th>${B.map((b) => `<th>${esc(b.code.slice(3))}</th>`).join('')}</tr></thead><tbody>
      ${rows.map((r) => { const nm = (names[r.id] && names[r.id].name) || r.name || 'Candidate'; return `<tr><td class="first">${esc(nm)}${r.name && names[r.id]?.name && r.name !== names[r.id].name ? `<br><span class="hint">${esc(r.name)}</span>` : ''}</td><td class="mono">${r.passedCount || 0}/20</td><td class="mono">${esc(r.completed || '—')}</td>${B.map((b) => { const x = (r.briefings || {})[b.code]; return `<td class="mono">${x ? `<span class="pill ${x.passed ? 'ok' : 'ko'}">${x.best}</span>` : '<span class="pill na">–</span>'}</td>`; }).join('')}</tr>`; }).join('')}
      </tbody></table></div></section>`;
  } catch (e) { view.innerHTML = `<section class="sec"><h2>Candidate results</h2><p>The training records could not be loaded. Reload the page to try again.</p></section>`; }
}

// ---------- Routing ----------
function route() {
  const h = (location.hash || '#home').slice(1);
  closeMap();
  if (h === 'certificate') { renderMap('certificate'); renderCertificate(); }
  else if (h === 'results') { renderMap('results'); renderResults(); }
  else { const i = B.findIndex((b) => slug(b.code) === h); if (i >= 0) { renderMap(B[i].code); renderBriefing(i); } else { renderMap('home'); renderHome(); } }
  window.scrollTo(0, 0);
}
